name: ServiceFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evaluation-contracts:
    name: Data provenance and evaluation contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/evaluation/eval_v2.py validate
      - run: python -B scripts/evaluation/eval_v2.py validate --suite quality/evaluation/datasets/refund-sandbox-v1.json
      - run: python -B scripts/evaluation/eval_v2.py validate --suite quality/evaluation/datasets/rag-diagnostics-v1.json --package data/retail-holdout-v2
      - run: python -B scripts/evaluation/eval_v2.py validate --suite quality/evaluation/datasets/rag-context-followup-v1.json --package data/retail-holdout-v2
      - run: python -B -m unittest discover -s scripts/evaluation/tests
      - name: Validate public-only cloud smoke inputs without API calls
        run: |
          python -B scripts/evaluation/prepare_cloud_smoke.py
          python -B scripts/evaluation/eval_v2.py validate --suite quality/evaluation/reports/cloud-smoke-inputs/suite.json --package quality/evaluation/reports/cloud-smoke-inputs/package

  backend-unit:
    name: Backend unit and quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests, formatting and coverage gate
        working-directory: apps/serviceflow-server
        run: mvn -B -DskipITs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-reports
          path: |
            apps/serviceflow-server/target/surefire-reports
            apps/serviceflow-server/target/site/jacoco

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Testcontainers integration suite
        working-directory: apps/serviceflow-server
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-reports
          path: apps/serviceflow-server/target/failsafe-reports

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/serviceflow-web/package-lock.json
      - name: Install dependencies
        working-directory: apps/serviceflow-web
        run: npm ci
      - name: Lint
        working-directory: apps/serviceflow-web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/serviceflow-web
        run: npm test -- --run
      - name: Production build
        working-directory: apps/serviceflow-web
        run: npm run build

  compose-e2e:
    name: Live refund API scenarios and browser UI tests
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend, evaluation-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/serviceflow-web/package-lock.json
      - name: Start isolated Compose stack in demo mode
        run: |
          docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml up -d --build --wait --wait-timeout 300
      - name: Wait for web health endpoint
        run: |
          for i in {1..60}; do curl --fail --silent http://localhost:15173/ && exit 0; sleep 2; done
          docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml ps
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import public data and wait for asynchronous ingestion
        run: python -B scripts/evaluation/import_retail.py --wait-seconds 180
      - name: Prepare synthetic orders in the isolated evaluation database
        run: |
          python -B scripts/evaluation/prepare_v2_fixtures.py --suite quality/evaluation/datasets/refund-sandbox-v1.json
          fixture=$(find quality/evaluation/reports -name fixtures.sql -print -quit)
          test -n "$fixture"
          docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml exec -T mysql mysql --default-character-set=utf8mb4 -userviceflow -peval-only-password serviceflow_eval_v2 < "$fixture"
          echo "REFUND_FIXTURES=${fixture%.sql}.json" >> "$GITHUB_ENV"
      - name: Verify cancellation and refund over real HTTP and database
        run: python -B scripts/evaluation/eval_v2.py run --suite quality/evaluation/datasets/refund-sandbox-v1.json --fixtures "$REFUND_FIXTURES" --mode demo
      - name: Verify response loss, action-cache eviction and server restart
        run: |
          python -B scripts/evaluation/recovery_demo.py --allow-isolated-faults
          fixture=$(find quality/evaluation/reports -path '*/recovery-*/fixtures.json' -print -quit)
          test -n "$fixture"
          echo "RECOVERY_FIXTURES=$(realpath "$fixture")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-scenario-summaries
          path: quality/evaluation/reports/**/summary.json
      - name: Install frontend dependencies and browser
        working-directory: apps/serviceflow-web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: apps/serviceflow-web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:15173
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/serviceflow-web/playwright-report
      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml ps
          docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml logs --no-color --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml down -v
