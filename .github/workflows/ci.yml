name: ServiceFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-unit:
    name: Backend unit and quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests, formatting and coverage gate
        working-directory: apps/serviceflow-server
        run: mvn -B -DskipITs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-reports
          path: |
            apps/serviceflow-server/target/surefire-reports
            apps/serviceflow-server/target/site/jacoco

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Testcontainers integration suite
        working-directory: apps/serviceflow-server
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-reports
          path: apps/serviceflow-server/target/failsafe-reports

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/serviceflow-web/package-lock.json
      - name: Install dependencies
        working-directory: apps/serviceflow-web
        run: npm ci
      - name: Lint
        working-directory: apps/serviceflow-web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/serviceflow-web
        run: npm test -- --run
      - name: Production build
        working-directory: apps/serviceflow-web
        run: npm run build

  compose-e2e:
    name: Compose Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/serviceflow-web/package-lock.json
      - name: Start isolated Compose stack in demo mode
        run: |
          # Demo-mode E2E does not call Milvus or the observability stack. Starting
          # only the required services keeps the hosted runner small and reliable.
          docker compose up -d mysql redis rabbitmq
          docker compose build server web
          docker compose up -d --no-deps server web
      - name: Wait for web health endpoint
        run: |
          for i in {1..60}; do curl --fail --silent http://localhost:5173/ && exit 0; sleep 2; done
          docker compose ps
          exit 1
      - name: Install frontend dependencies and browser
        working-directory: apps/serviceflow-web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright suite
        working-directory: apps/serviceflow-web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/serviceflow-web/playwright-report
      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
