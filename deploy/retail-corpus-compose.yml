# Isolated local corpus. Keep the same project name to reopen its volumes.
services:
  server:
    extends: {file: evaluation-compose.yml, service: server}
    image: serviceflow-retail-corpus-server:local
    ports: !override ["127.0.0.1:28480:8080"]
    environment:
      MYSQL_DATABASE: serviceflow_eval_retail_corpus
      SERVICEFLOW_AI_MODE: demo
      SERVICEFLOW_RAG_MODE: cloud
      SERVICEFLOW_REFUND_SANDBOX_ENABLED: "false"
      SPRING_APPLICATION_JSON: '{"serviceflow":{"rag":{"embedding-dimension":512}}}'
      OPENAI_BASE_URL: http://127.0.0.1:9
      OPENAI_EMBEDDING_BASE_URL: http://embedding:80/v1
      OPENAI_EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      OPENAI_RERANKER_BASE_URL: http://127.0.0.1:9
      MILVUS_REST_URL: http://milvus:19530
      MILVUS_COLLECTION_NAME: retail_manuals_bge_zh_v15
    depends_on:
      milvus: {condition: service_healthy}
      embedding: {condition: service_healthy}
  mysql:
    extends: {file: evaluation-compose.yml, service: mysql}
    environment:
      MYSQL_DATABASE: serviceflow_eval_retail_corpus
  redis:
    extends: {file: evaluation-compose.yml, service: redis}
  rabbitmq:
    extends: {file: evaluation-compose.yml, service: rabbitmq}
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
  milvus:
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - eval-milvus:/var/lib/milvus
      - ./milvus/embed-etcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.10
    command: ["--model-id", "/model", "--pooling", "cls", "--auto-truncate"]
    environment:
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ../local-datasets/retail-official-v1/model:/model:ro
volumes:
  eval-mysql:
  eval-uploads:
  eval-milvus:
