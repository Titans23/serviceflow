# Isolated, loopback-only demo evaluation. No .env credentials or cloud providers.
# Always use: docker compose -p serviceflow-eval -f deploy/evaluation-compose.yml ...
services:
  server:
    build: ../apps/serviceflow-server
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: serviceflow_eval_v2
      MYSQL_USER: serviceflow
      MYSQL_PASSWORD: eval-only-password
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: serviceflow
      RABBITMQ_PASSWORD: eval-only-password
      JWT_SECRET: evaluation-only-jwt-secret-at-least-32-bytes
      SERVICEFLOW_AI_MODE: demo
      SERVICEFLOW_RAG_MODE: demo
      SERVICEFLOW_EVALUATION_ENABLED: "true"
      SERVICEFLOW_CORS_ALLOWED_ORIGINS: "http://localhost:15173,http://127.0.0.1:15173"
      SERVICEFLOW_REFUND_SANDBOX_ENABLED: "true"
      SERVICEFLOW_GUEST_RATE_LIMIT_MAX_REQUESTS: "1000"
      OPENAI_API_KEY: disabled
      SPRING_AI_MODEL_CHAT: none
      SPRING_AI_MODEL_EMBEDDING: none
      TRACING_SAMPLING_PROBABILITY: "0.0"
      UPLOAD_DIR: /data/uploads
    ports: ["127.0.0.1:18080:8080"]
    volumes: [eval-uploads:/data/uploads]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  web:
    build: ../apps/serviceflow-web
    ports: ["127.0.0.1:15173:80"]
    depends_on:
      server: {condition: service_healthy}
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: serviceflow_eval_v2
      MYSQL_USER: serviceflow
      MYSQL_PASSWORD: eval-only-password
      MYSQL_ROOT_PASSWORD: eval-only-root-password
    volumes: [eval-mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: serviceflow
      RABBITMQ_DEFAULT_PASS: eval-only-password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  eval-mysql:
  eval-uploads:
