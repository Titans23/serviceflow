    <script id="wiki-data" type="application/json">[{"id":"overview","group":"开始阅读","title":"ServiceFlow 架构导读","headings":[{"title":"从哪条链路开始","id":"从哪条链路开始","level":"h2"},{"title":"系统组成","id":"系统组成","level":"h2"},{"title":"各组件保存什么","id":"各组件保存什么","level":"h2"},{"title":"源码分层","id":"源码分层","level":"h2"},{"title":"实现范围","id":"实现范围","level":"h2"}],"html":"\u003ch1 id=\"serviceflow-架构导读\">ServiceFlow 架构导读\u003c/h1>\n\u003cp>ServiceFlow 是一个有业务状态的 AI 客服与售后系统。模型负责理解问题、选择证据和提出查询计划；订单归属、取消确认、退款金额和最终状态由后端验证并持久化。\u003c/p>\n\u003ch2 id=\"从哪条链路开始\">从哪条链路开始\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>想了解什么\u003c/th>\n\u003cth>阅读路径\u003c/th>\n\u003cth>重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Agent 如何接入业务\u003c/td>\n\u003ctd>\u003ca href=\"#article/chat\">聊天请求\u003c/a> → \u003ca href=\"#article/orders\">订单规划\u003c/a> → \u003ca href=\"#article/confirmation\">取消确认\u003c/a>\u003c/td>\n\u003ctd>模型输出的边界、权限、事务和结果恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG 如何提供可追溯回答\u003c/td>\n\u003ctd>\u003ca href=\"#article/knowledge\">知识入库\u003c/a> → \u003ca href=\"#article/rag\">检索与回答\u003c/a> → \u003ca href=\"#article/evaluation\">评测\u003c/a>\u003c/td>\n\u003ctd>活动版本、中文检索、事实编号、逐阶段指标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端如何处理不确定结果\u003c/td>\n\u003ctd>\u003ca href=\"#article/refund\">异步退款\u003c/a> → \u003ca href=\"#article/after-sales\">工单与退货\u003c/a>\u003c/td>\n\u003ctd>数据库任务、租约、查询优先、人工接手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>如何运行和验证\u003c/td>\n\u003ctd>\u003ca href=\"#article/operations\">运行与排查\u003c/a> → \u003ca href=\"#article/verification\">验证与开发\u003c/a>\u003c/td>\n\u003ctd>Demo / Cloud 边界、隔离环境、真实证据\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"系统组成\">系统组成\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Vue 3 / Nginx\n     │ REST + POST SSE\nSpring Boot / MVC + Virtual Threads\n     ├─ CustomerWorkflow / LangGraph4j\n     │    ├─ 商品事实 / 订单查询 / 确认 / 工单\n     │    └─ Milvus → Reranker → Grader → 事实编号选择\n     ├─ MySQL：业务事实、正式会话、动作决定、任务和账本\n     ├─ Redis：访客会话、近期记忆、候选订单、Checkpoint\n     └─ RabbitMQ：知识入库事件、退款任务通知\n             └─ 独立退款模拟渠道 / HTTP + SQLite\n\u003c/code>\u003c/pre>\n\u003cp>Java 21、Spring Boot、MyBatis 和 Flyway 构成后端；Vue 3、TypeScript 和 Pinia 构成前端。模型通过 Spring AI 接口和百炼协议适配接入。具体依赖版本以 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/pom.xml\" target=\"_blank\" rel=\"noopener noreferrer\">pom.xml\u003c/a> 和 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-web/package.json\" target=\"_blank\" rel=\"noopener noreferrer\">package.json\u003c/a> 为准。\u003c/p>\n\u003ch2 id=\"各组件保存什么\">各组件保存什么\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组件\u003c/th>\n\u003cth>保存的内容\u003c/th>\n\u003cth>不能替代什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>MySQL\u003c/td>\n\u003ctd>订单、确认结果、退款请求、Outbox、正式会话和审计\u003c/td>\n\u003ctd>不能直接与文件系统或 Milvus 做一个数据库事务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Redis\u003c/td>\n\u003ctd>有期限的上下文、候选列表、图 Checkpoint、访客限流\u003c/td>\n\u003ctd>不能授权退款，也不是持久业务执行凭证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RabbitMQ\u003c/td>\n\u003ctd>提醒消费者处理某个持久任务\u003c/td>\n\u003ctd>消息被确认不等于退款或入库已完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Milvus\u003c/td>\n\u003ctd>文档版本对应的向量、稀疏索引和原文分块\u003c/td>\n\u003ctd>不是价格、订单状态和支付结果的权威来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型\u003c/td>\n\u003ctd>分类、查询计划、充分性判定、事实编号选择\u003c/td>\n\u003ctd>不直接修改数据库，不自行决定退款金额\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"源码分层\">源码分层\u003c/h2>\n\u003cp>从 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/controller/ChatController.java\" target=\"_blank\" rel=\"noopener noreferrer\">ChatController\u003c/a> 开始，依次读应用服务、工作流、业务服务和 Mapper。Agent/RAG 不绕过业务 Service 直接写订单。\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>controller/\u003c/code>：请求校验、身份获取和 REST/SSE 协议。\u003c/li>\n\u003cli>\u003ccode>service/impl/\u003c/code> 与 \u003ccode>service/ActionDecisionService\u003c/code> 等：业务编排、事务、授权和状态转换。\u003c/li>\n\u003cli>\u003ccode>agent/\u003c/code>：意图路由、商品上下文和订单查询计划执行。\u003c/li>\n\u003cli>\u003ccode>ai/\u003c/code>、\u003ccode>rag/\u003c/code>：模型协议、证据选择、检索与诊断。\u003c/li>\n\u003cli>\u003ccode>infrastructure/\u003c/code>：Redis 记忆、消息投递、任务消费者。\u003c/li>\n\u003cli>\u003ccode>mapper/\u003c/code>、\u003ca href=\"https://github.com/Titans23/serviceflow/tree/main/apps/serviceflow-server/src/main/resources/mapper\" target=\"_blank\" rel=\"noopener noreferrer\">XML\u003c/a> 与 \u003ca href=\"https://github.com/Titans23/serviceflow/tree/main/apps/serviceflow-server/src/main/resources/db/migration\" target=\"_blank\" rel=\"noopener noreferrer\">迁移\u003c/a>：SQL、锁和唯一约束。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"实现范围\">实现范围\u003c/h2>\n\u003cp>项目提供商品咨询、本人订单查询、取消确认、异步退款、工单协作和单件全额退货。退款渠道是独立模拟服务；公开商品资料与合成订单用于验证。当前不是通用 Agent Harness，也没有真实支付结算、多商户或无限工具循环。\u003c/p>\n\u003cp>旧技术报告和阶段验收保留在 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/archive/README.md\" target=\"_blank\" rel=\"noopener noreferrer\">历史文档索引\u003c/a>。Wiki 描述当前代码，历史报告只证明其标注版本上的受测行为。\u003c/p>\n","text":"ServiceFlow 架构导读 ServiceFlow 是一个有业务状态的 AI 客服与售后系统。模型负责理解问题、选择证据和提出查询计划；订单归属、取消确认、退款金额和最终状态由后端验证并持久化。 从哪条链路开始 想了解什么 阅读路径 重点 Agent 如何接入业务 聊天请求 → 订单规划 → 取消确认 模型输出的边界、权限、事务和结果恢复 RAG 如何提供可追溯回答 知识入库 → 检索与回答 → 评测 活动版本、中文检索、事实编号、逐阶段指标 后端如何处理不确定结果 异步退款 → 工单与退货 数据库任务、租约、查询优先、人工接手 如何运行和验证 运行与排查 → 验证与开发 Demo / Cloud 边界、隔离环境、真实证据 系统组成 Vue 3 / Nginx │ REST + POST SSE Spring Boot / MVC + Virtual Threads ├─ CustomerWorkflow / LangGraph4j │ ├─ 商品事实 / 订单查询 / 确认 / 工单 │ └─ Milvus → Reranker → Grader → 事实编号选择 ├─ MySQL：业务事实、正式会话、动作决定、任务和账本 ├─ Redis：访客会话、近期记忆、候选订单、Checkpoint └─ RabbitMQ：知识入库事件、退款任务通知 └─ 独立退款模拟渠道 / HTTP + SQLite Java 21、Spring Boot、MyBatis 和 Flyway 构成后端；Vue 3、TypeScript 和 Pinia 构成前端。模型通过 Spring AI 接口和百炼协议适配接入。具体依赖版本以 pom.xml 和 package.json 为准。 各组件保存什么 组件 保存的内容 不能替代什么 MySQL 订单、确认结果、退款请求、Outbox、正式会话和审计 不能直接与文件系统或 Milvus 做一个数据库事务 Redis 有期限的上下文、候选列表、图 Checkpoint、访客限流 不能授权退款，也不是持久业务执行凭证 RabbitMQ 提醒消费者处理某个持久任务 消息被确认不等于退款或入库已完成 Milvus 文档版本对应的向量、稀疏索引和原文分块 不是价格、订单状态和支付结果的权威来源 模型 分类、查询计划、充分性判定、事实编号选择 不直接修改数据库，不自行决定退款金额 源码分层 从 ChatController 开始，依次读应用服务、工作流、业务服务和 Mapper。Agent/RAG 不绕过业务 Service 直接写订单。 `controller/`：请求校验、身份获取和 REST/SSE 协议。 `service/impl/` 与 `service/ActionDecisionService` 等：业务编排、事务、授权和状态转换。 `agent/`：意图路由、商品上下文和订单查询计划执行。 `ai/`、`rag/`：模型协议、证据选择、检索与诊断。 `infrastructure/`：Redis 记忆、消息投递、任务消费者。 `mapper/`、XML 与 迁移：SQL、锁和唯一约束。 实现范围 项目提供商品咨询、本人订单查询、取消确认、异步退款、工单协作和单件全额退货。退款渠道是独立模拟服务；公开商品资料与合成订单用于验证。当前不是通用 Agent Harness，也没有真实支付结算、多商户或无限工具循环。 旧技术报告和阶段验收保留在 历史文档索引。Wiki 描述当前代码，历史报告只证明其标注版本上的受测行为。"},{"id":"chat","group":"Agent 与业务执行","title":"聊天请求与会话","headings":[{"title":"一次聊天请求","id":"一次聊天请求","level":"h2"},{"title":"普通聊天断线恢复","id":"普通聊天断线恢复","level":"h2"},{"title":"多商品比较","id":"多商品比较","level":"h2"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"聊天请求与会话\">聊天请求与会话\u003c/h1>\n\u003cp>沿一次 POST SSE 请求看身份、幂等、工作流和响应如何衔接。\u003c/p>\n\u003ch2 id=\"一次聊天请求\">一次聊天请求\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>ChatController\u003c/code> 校验请求并获取当前主体，立即创建 \u003ccode>SseEmitter\u003c/code>。\u003c/li>\n\u003cli>CUSTOMER 请求由 \u003ccode>ChatRequestStore\u003c/code> 在 MySQL 登记为 \u003ccode>PROCESSING\u003c/code>。失败或超过 2 分钟的处理记录可接管，完成与失败更新均需匹配当前执行标识。GUEST 在同一 Redis 脚本内检查完成结果并领取 2 分钟的锁，提交时验证标识并原子保存历史和 30 分钟完成记录。\u003c/li>\n\u003cli>\u003ccode>ChatController.stream\u003c/code>将实际工作交给虚拟线程；\u003ccode>ChatServiceImpl\u003c/code>调用\u003ccode>CustomerWorkflow\u003c/code>。Router结合模型分类与业务规则选择CHAT、PRODUCT_QUERY、KNOWLEDGE_QUERY、ORDER_QUERY或COMPLAINT。RedisSaver按sessionId记录图状态，但不负责业务副作用的可靠重放。\u003c/li>\n\u003cli>产品请求先从 MySQL 读取结构化事实，再按 \u003ccode>productId\u003c/code> 和活动知识版本过滤 Milvus；比较事件仅使用类别白名单字段。\n商品页提示仅绑定入口会话，首次商品响应后不再逐轮覆盖记忆；手动选择历史会话会清除入口提示。页面与记忆商品都经过本轮明确SKU/型号的切换判断，未知SKU清除旧引用，避免旧商品范围进入检索与事实池。\u003c/li>\n\u003cli>RAG执行Dense/BM25各Top20、RRF融合、Reranker Top5和Grader；不足时至多改写一次并重检。两轮固定商品/文档类型/活动版本，Grader均判原问题。Reranker失败保留RRF Top5，Grader失败保留候选但判不足，累计降级不会被后轮成功清除；无证据不使用模型常识补全。\u003c/li>\n\u003c/ol>\n\u003cp>商品事实回答采用受约束的证据选择：云模型返回本轮事实编号，后端校验编号后输出目录事实或完整检索段落，阻止自由扩写参数和使用条件。选择完成后再发送正文 token，因而不再逐 token 转发模型自由生成。事实选择是否相关、是否完整仍需要评测；原始资料错误也不会被这种机制自动纠正。\u003ccode>rag_evidence\u003c/code> SSE 元数据仅提供分块 ID 和来源，不包含原文。\n6. \u003ccode>SseEventWriter\u003c/code> 统一发出 \u003ccode>progress\u003c/code>、\u003ccode>meta\u003c/code>、\u003ccode>token\u003c/code>、结构化业务事件、\u003ccode>done\u003c/code> 或稳定错误码，并在关闭/超时/异常时递减连接指标。工作流执行前发送处理进度；首段非空正文产生时记录 \u003ccode>serviceflow.chat.first_token_server\u003c/code>，口径是服务端处理起点到正文产生，不包含缓存重放，也不代表浏览器收到数据的时间。\n7. 客户请求的 begin 事务登记请求与用户消息，complete 事务登记助手消息与完成状态；两者之间包含外部模型调用，不是一笔长事务。独立 AI 审计默认不复制问题/回答正文，读取接口默认隐藏历史正文；\u003ccode>SERVICEFLOW_AUDIT_RECORD_CONTENT=true\u003c/code> 可显式开启。原聊天历史与旧审计数据均保留，不能宣称已删除或全面匿名化。公共报告只保留脱敏结果，不提交原始记录、JWT 或 API Key。\u003c/p>\n\u003ch2 id=\"普通聊天断线恢复\">普通聊天断线恢复\u003c/h2>\n\u003cp>前端以 \u003ccode>done\u003c/code> 确认本轮收全。读流失败或提前结束时，保留正文并显示「重试本轮」。点击后向原 SSE 端点提交同一会话、同一 \u003ccode>clientRequestId\u003c/code> 和完整的原请求体。已完成的请求重放原消息编号、正文和业务卡片，处理中保留原气泡，失败的请求领取新执行标识后重新执行。\u003c/p>\n\u003cp>重试入口保存在当前聊天页，适用于当前会话的最新一轮。用户可以直接发新一轮，旧气泡保留中断提示。刷新后可以从历史查看已保存的消息。订单取消确认仍使用独立的动作编号和只读核验接口。\u003c/p>\n\u003cp>确定性业务结果先保存，再发送正文和卡片。流式模型回答在生成完成后保存，然后发送 \u003ccode>done\u003c/code>。升级时先执行 V16 迁移，新代码接管流量前让旧版聊天流结束，确保所有执行者都按执行标识提交和清理。\u003c/p>\n\u003ch2 id=\"多商品比较\">多商品比较\u003c/h2>\n\u003cp>商品路由一次提取有序目标列表，MySQL 逐项核对 SKU、型号、容量和地区。需要澄清时，\u003ccode>comparison_selection_required\u003c/code> 带已确认商品和逐项候选。比如要比较 10 款、已确认 8 款，用户可补充其余两款，也可先比较已确认的 8 款。\u003c/p>\n\u003cp>聊天支持比较 2–10 款同类别商品，独立比较页支持 2–3 款。待比较列表在 Redis 按主体与会话保存 30 分钟。通过 \u003ccode>comparisonSelection\u003c/code> 选择候选、补充型号或请求先比较已确认的商品。部分比较后仍可继续补充，候选与对比表都支持历史展示和同请求重放。\u003c/p>\n\u003cp>模型不可用时，规则按明确列出的商品逐项匹配目录。查不准的商品保留为待确认，已确认的商品可以继续比较。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/controller/ChatController.java\" target=\"_blank\" rel=\"noopener noreferrer\">ChatController\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/ChatServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">ChatServiceImpl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/support/ChatRequestStore.java\" target=\"_blank\" rel=\"noopener noreferrer\">ChatRequestStore\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/agent/CustomerWorkflow.java\" target=\"_blank\" rel=\"noopener noreferrer\">CustomerWorkflow\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/agent/ProductComparisonConversation.java\" target=\"_blank\" rel=\"noopener noreferrer\">ProductComparisonConversation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/web/sse/SseEventWriter.java\" target=\"_blank\" rel=\"noopener noreferrer\">SseEventWriter\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"聊天请求与会话 沿一次 POST SSE 请求看身份、幂等、工作流和响应如何衔接。 一次聊天请求 `ChatController` 校验请求并获取当前主体，立即创建 `SseEmitter`。 CUSTOMER 请求由 `ChatRequestStore` 在 MySQL 登记为 `PROCESSING`。失败或超过 2 分钟的处理记录可接管，完成与失败更新均需匹配当前执行标识。GUEST 在同一 Redis 脚本内检查完成结果并领取 2 分钟的锁，提交时验证标识并原子保存历史和 30 分钟完成记录。 `ChatController.stream`将实际工作交给虚拟线程；`ChatServiceImpl`调用`CustomerWorkflow`。Router结合模型分类与业务规则选择CHAT、PRODUCT_QUERY、KNOWLEDGE_QUERY、ORDER_QUERY或COMPLAINT。RedisSaver按sessionId记录图状态，但不负责业务副作用的可靠重放。 产品请求先从 MySQL 读取结构化事实，再按 `productId` 和活动知识版本过滤 Milvus；比较事件仅使用类别白名单字段。 商品页提示仅绑定入口会话，首次商品响应后不再逐轮覆盖记忆；手动选择历史会话会清除入口提示。页面与记忆商品都经过本轮明确SKU/型号的切换判断，未知SKU清除旧引用，避免旧商品范围进入检索与事实池。 RAG执行Dense/BM25各Top20、RRF融合、Reranker Top5和Grader；不足时至多改写一次并重检。两轮固定商品/文档类型/活动版本，Grader均判原问题。Reranker失败保留RRF Top5，Grader失败保留候选但判不足，累计降级不会被后轮成功清除；无证据不使用模型常识补全。 商品事实回答采用受约束的证据选择：云模型返回本轮事实编号，后端校验编号后输出目录事实或完整检索段落，阻止自由扩写参数和使用条件。选择完成后再发送正文 token，因而不再逐 token 转发模型自由生成。事实选择是否相关、是否完整仍需要评测；原始资料错误也不会被这种机制自动纠正。`rag_evidence` SSE 元数据仅提供分块 ID 和来源，不包含原文。 6. `SseEventWriter` 统一发出 `progress`、`meta`、`token`、结构化业务事件、`done` 或稳定错误码，并在关闭/超时/异常时递减连接指标。工作流执行前发送处理进度；首段非空正文产生时记录 `serviceflow.chat.first_token_server`，口径是服务端处理起点到正文产生，不包含缓存重放，也不代表浏览器收到数据的时间。 7. 客户请求的 begin 事务登记请求与用户消息，complete 事务登记助手消息与完成状态；两者之间包含外部模型调用，不是一笔长事务。独立 AI 审计默认不复制问题/回答正文，读取接口默认隐藏历史正文；`SERVICEFLOW_AUDIT_RECORD_CONTENT=true` 可显式开启。原聊天历史与旧审计数据均保留，不能宣称已删除或全面匿名化。公共报告只保留脱敏结果，不提交原始记录、JWT 或 API Key。 普通聊天断线恢复 前端以 `done` 确认本轮收全。读流失败或提前结束时，保留正文并显示「重试本轮」。点击后向原 SSE 端点提交同一会话、同一 `clientRequestId` 和完整的原请求体。已完成的请求重放原消息编号、正文和业务卡片，处理中保留原气泡，失败的请求领取新执行标识后重新执行。 重试入口保存在当前聊天页，适用于当前会话的最新一轮。用户可以直接发新一轮，旧气泡保留中断提示。刷新后可以从历史查看已保存的消息。订单取消确认仍使用独立的动作编号和只读核验接口。 确定性业务结果先保存，再发送正文和卡片。流式模型回答在生成完成后保存，然后发送 `done`。升级时先执行 V16 迁移，新代码接管流量前让旧版聊天流结束，确保所有执行者都按执行标识提交和清理。 多商品比较 商品路由一次提取有序目标列表，MySQL 逐项核对 SKU、型号、容量和地区。需要澄清时，`comparison_selection_required` 带已确认商品和逐项候选。比如要比较 10 款、已确认 8 款，用户可补充其余两款，也可先比较已确认的 8 款。 聊天支持比较 2–10 款同类别商品，独立比较页支持 2–3 款。待比较列表在 Redis 按主体与会话保存 30 分钟。通过 `comparisonSelection` 选择候选、补充型号或请求先比较已确认的商品。部分比较后仍可继续补充，候选与对比表都支持历史展示和同请求重放。 模型不可用时，规则按明确列出的商品逐项匹配目录。查不准的商品保留为待确认，已确认的商品可以继续比较。 源码阅读入口 ChatController ChatServiceImpl ChatRequestStore CustomerWorkflow ProductComparisonConversation SseEventWriter"},{"id":"orders","group":"Agent 与业务执行","title":"订单定位与工具规划","headings":[{"title":"我的订单与多订单追问","id":"我的订单与多订单追问","level":"h2"},{"title":"一次规划与确定性执行","id":"一次规划与确定性执行","level":"h2"},{"title":"候选选择与上下文失效","id":"候选选择与上下文失效","level":"h2"},{"title":"从查询到取消申请","id":"从查询到取消申请","level":"h2"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"订单定位与工具规划\">订单定位与工具规划\u003c/h1>\n\u003cp>自然语言先确定查询目标，再由后端执行受约束的业务操作。\u003c/p>\n\u003ch2 id=\"我的订单与多订单追问\">我的订单与多订单追问\u003c/h2>\n\u003cp>\u003ccode>GET /orders\u003c/code> 从登录身份取得 customerId，按商品名称/型号/SKU/类别、订单号、状态和下单日期查询本人订单。新增 \u003ccode>orderNo\u003c/code> 精确筛选参数，使用现有唯一索引；原 \u003ccode>keyword\u003c/code> 继续保持文字匹配语义。网页识别到 \u003ccode>SF + 至少12位数字\u003c/code> 的完整编号时使用 \u003ccode>orderNo\u003c/code>，其他输入使用 \u003ccode>keyword\u003c/code>。日期按北京时间解释，结束日包含全天；分页用创建时间与 ID 的组合游标，游标先校验归属。同页商品明细一次批量读取，避免每笔订单再发一条 SQL。\u003c/p>\n\u003ch2 id=\"一次规划与确定性执行\">一次规划与确定性执行\u003c/h2>\n\u003cp>从订单卡进入客服会创建独立会话，页面传入 \u003ccode>pageContext.orderNo\u003c/code>，后端使用前再次查归属。Cloud 模式在 ORDER_QUERY 分支提供 \u003ccode>search_orders\u003c/code>、\u003ccode>read_current_order\u003c/code>、\u003ccode>select_order_candidate\u003c/code>、\u003ccode>ask_order_clarification\u003c/code> 四个原生工具。Spring AI 返回调用请求，Java 校验参数后调用既有 OrderService，直接用结果生成回复与 SSE 卡片。\u003c/p>\n\u003cp>订单工具规划默认最多等待 5 秒。模型超时、不可用或返回非法调用时，使用和演示模式一致的本地规则。已知商品类别、明确日期词或明确的订单列表请求可以继续查询，条件不完整时请用户补充。可用 \u003ccode>serviceflow.ai.order-tools-enabled=false\u003c/code> 直接使用本地规则。\u003c/p>\n\u003cp>完整订单号查询，以及已有明确订单且没有待选候选时的限定状态追问，直接进入订单分支并查询业务服务，省去分类与规划模型调用。规则采用完整匹配；投诉、取消和混合请求不会被这个快捷路径吞掉。快捷路径同样使用登录客户的身份查归属，不能跳过授权，也不以规则命中率代表模型理解能力。\u003c/p>\n\u003ch2 id=\"候选选择与上下文失效\">候选选择与上下文失效\u003c/h2>\n\u003cp>查询唯一命中时展示订单；多笔命中时返回 \u003ccode>order_selection_required\u003c/code>，最多展示 10 笔，并在 Redis 按主体与会话缓存候选、queryId 和待处理意图 30 分钟。用户可回复“第二笔”或点击卡片。卡片必须匹配当前 queryId 和候选集合，选中后再次读取本人订单。重新查询清除旧订单指代；旧卡片失效后要求重新查询。候选卡和订单事实随助手消息存入 MySQL，支持历史展示及相同 clientRequestId 的结果重放；历史卡片展示不延长候选的可选择期限。\u003c/p>\n\u003ch2 id=\"从查询到取消申请\">从查询到取消申请\u003c/h2>\n\u003cp>“取消昨天买的耳机”先查本人订单，多笔时先选定，再生成绑定该订单的确认卡。查询、选择候选、生成确认卡都不会修改订单或创建退款。订单事实由后端查询结果生成；模型识别日期、条件和指代的效果仍需独立的 Cloud 评测，确定性测试不代表模型准确率。\u003c/p>\n\u003cp>订单号直达和模型查询计划共用取消意图门槛。否定取消、询问取消状态/条件以及只查物流退款时返回查询结果；候选订单的待取消意图同时清除。明确请求取消或继续选择此前待取消候选时才允许生成确认卡。刷新仅恢复最新消息上的有效待确认卡，用户继续查询后不恢复更早的卡片。此规则采用保守的中文表达判断，复杂混合请求可能需要用户另发明确的取消指令。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/agent/OrderConversation.java\" target=\"_blank\" rel=\"noopener noreferrer\">OrderConversation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/ai/CloudAiGateway.java\" target=\"_blank\" rel=\"noopener noreferrer\">CloudAiGateway\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/ai/OrderCancellationIntent.java\" target=\"_blank\" rel=\"noopener noreferrer\">OrderCancellationIntent\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/OrderServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">OrderServiceImpl\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"订单定位与工具规划 自然语言先确定查询目标，再由后端执行受约束的业务操作。 我的订单与多订单追问 `GET /orders` 从登录身份取得 customerId，按商品名称/型号/SKU/类别、订单号、状态和下单日期查询本人订单。新增 `orderNo` 精确筛选参数，使用现有唯一索引；原 `keyword` 继续保持文字匹配语义。网页识别到 `SF + 至少12位数字` 的完整编号时使用 `orderNo`，其他输入使用 `keyword`。日期按北京时间解释，结束日包含全天；分页用创建时间与 ID 的组合游标，游标先校验归属。同页商品明细一次批量读取，避免每笔订单再发一条 SQL。 一次规划与确定性执行 从订单卡进入客服会创建独立会话，页面传入 `pageContext.orderNo`，后端使用前再次查归属。Cloud 模式在 ORDER_QUERY 分支提供 `search_orders`、`read_current_order`、`select_order_candidate`、`ask_order_clarification` 四个原生工具。Spring AI 返回调用请求，Java 校验参数后调用既有 OrderService，直接用结果生成回复与 SSE 卡片。 订单工具规划默认最多等待 5 秒。模型超时、不可用或返回非法调用时，使用和演示模式一致的本地规则。已知商品类别、明确日期词或明确的订单列表请求可以继续查询，条件不完整时请用户补充。可用 `serviceflow.ai.order-tools-enabled=false` 直接使用本地规则。 完整订单号查询，以及已有明确订单且没有待选候选时的限定状态追问，直接进入订单分支并查询业务服务，省去分类与规划模型调用。规则采用完整匹配；投诉、取消和混合请求不会被这个快捷路径吞掉。快捷路径同样使用登录客户的身份查归属，不能跳过授权，也不以规则命中率代表模型理解能力。 候选选择与上下文失效 查询唯一命中时展示订单；多笔命中时返回 `order_selection_required`，最多展示 10 笔，并在 Redis 按主体与会话缓存候选、queryId 和待处理意图 30 分钟。用户可回复“第二笔”或点击卡片。卡片必须匹配当前 queryId 和候选集合，选中后再次读取本人订单。重新查询清除旧订单指代；旧卡片失效后要求重新查询。候选卡和订单事实随助手消息存入 MySQL，支持历史展示及相同 clientRequestId 的结果重放；历史卡片展示不延长候选的可选择期限。 从查询到取消申请 “取消昨天买的耳机”先查本人订单，多笔时先选定，再生成绑定该订单的确认卡。查询、选择候选、生成确认卡都不会修改订单或创建退款。订单事实由后端查询结果生成；模型识别日期、条件和指代的效果仍需独立的 Cloud 评测，确定性测试不代表模型准确率。 订单号直达和模型查询计划共用取消意图门槛。否定取消、询问取消状态/条件以及只查物流退款时返回查询结果；候选订单的待取消意图同时清除。明确请求取消或继续选择此前待取消候选时才允许生成确认卡。刷新仅恢复最新消息上的有效待确认卡，用户继续查询后不恢复更早的卡片。此规则采用保守的中文表达判断，复杂混合请求可能需要用户另发明确的取消指令。 源码阅读入口 OrderConversation CloudAiGateway OrderCancellationIntent OrderServiceImpl"},{"id":"confirmation","group":"Agent 与业务执行","title":"取消确认与结果恢复","headings":[{"title":"确认执行与未知结果","id":"确认执行与未知结果","level":"h2"},{"title":"重复决定与最终状态","id":"重复决定与最终状态","level":"h2"},{"title":"浏览器如何核验未知结果","id":"浏览器如何核验未知结果","level":"h2"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"取消确认与结果恢复\">取消确认与结果恢复\u003c/h1>\n\u003cp>将用户确认、订单状态变化与退款任务放在同一事务中裁决。\u003c/p>\n\u003ch2 id=\"确认执行与未知结果\">确认执行与未知结果\u003c/h2>\n\u003cp>\u003ccode>OrderConversation\u003c/code>生成绑定客户、会话、订单版本和来源请求的 \u003ccode>chat_action\u003c/code>，有效期 10 分钟。同一请求重复准备返回同一动作。\u003ccode>ActionDecisionService.decide\u003c/code>通过 \u003ccode>SELECT ... FOR UPDATE\u003c/code> 串行裁决同一动作的确认与放弃，取得会话共享锁以与逻辑删除排序，再复核订单版本和可取消状态。动作最终结果、订单条件更新、支付退款状态、唯一退款请求和操作账本在同一事务提交。SSE 返回在事务提交后开始，传输失败不回滚已经生效的业务，也不自动重做。\u003c/p>\n\u003ch2 id=\"重复决定与最终状态\">重复决定与最终状态\u003c/h2>\n\u003cp>结果接口可以读取 PENDING、CONFIRMED、REJECTED、EXPIRED、INVALIDATED、CONFLICT；PENDING 仍表示尚未取得最终结果，不能据此自动重发。确认胜出后再放弃、放弃胜出后再确认，都返回第一次裁决。历史的迁移前取消账本仍可查询；迁移前仅存在 Redis 中的未确认卡片需要重新发起申请。\u003c/p>\n\u003ch2 id=\"浏览器如何核验未知结果\">浏览器如何核验未知结果\u003c/h2>\n\u003cp>确认或放弃响应缺失时，浏览器通过\u003ccode>GET /chat/actions/{id}/result\u003c/code>查本人持久决定与订单；404、PENDING 或网络异常保留待核验标识，不自动重发决定。历史确认卡恢复时先查询动作状态，只有有效 PENDING 卡能继续显示。退款沙箱按eventId/attemptNo/金额及终态约束回调与重试。sessionStorage只是身份分区的关联线索，Checkpoint不是退款执行凭证。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/ActionDecisionService.java\" target=\"_blank\" rel=\"noopener noreferrer\">ActionDecisionService\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/ChatActionServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">ChatActionServiceImpl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/OrderServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">OrderServiceImpl\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"取消确认与结果恢复 将用户确认、订单状态变化与退款任务放在同一事务中裁决。 确认执行与未知结果 `OrderConversation`生成绑定客户、会话、订单版本和来源请求的 `chat_action`，有效期 10 分钟。同一请求重复准备返回同一动作。`ActionDecisionService.decide`通过 `SELECT ... FOR UPDATE` 串行裁决同一动作的确认与放弃，取得会话共享锁以与逻辑删除排序，再复核订单版本和可取消状态。动作最终结果、订单条件更新、支付退款状态、唯一退款请求和操作账本在同一事务提交。SSE 返回在事务提交后开始，传输失败不回滚已经生效的业务，也不自动重做。 重复决定与最终状态 结果接口可以读取 PENDING、CONFIRMED、REJECTED、EXPIRED、INVALIDATED、CONFLICT；PENDING 仍表示尚未取得最终结果，不能据此自动重发。确认胜出后再放弃、放弃胜出后再确认，都返回第一次裁决。历史的迁移前取消账本仍可查询；迁移前仅存在 Redis 中的未确认卡片需要重新发起申请。 浏览器如何核验未知结果 确认或放弃响应缺失时，浏览器通过`GET /chat/actions/{id}/result`查本人持久决定与订单；404、PENDING 或网络异常保留待核验标识，不自动重发决定。历史确认卡恢复时先查询动作状态，只有有效 PENDING 卡能继续显示。退款沙箱按eventId/attemptNo/金额及终态约束回调与重试。sessionStorage只是身份分区的关联线索，Checkpoint不是退款执行凭证。 源码阅读入口 ActionDecisionService ChatActionServiceImpl OrderServiceImpl"},{"id":"refund","group":"Agent 与业务执行","title":"异步退款与人工接手","headings":[{"title":"后台退款与人工接手","id":"后台退款与人工接手","level":"h2"},{"title":"查询优先与人工接手","id":"查询优先与人工接手","level":"h2"},{"title":"回调、旧批次与渠道边界","id":"回调旧批次与渠道边界","level":"h2"},{"title":"客服如何接续处理","id":"客服如何接续处理","level":"h2"},{"title":"模型调用的取消边界","id":"模型调用的取消边界","level":"h2"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"异步退款与人工接手\">异步退款与人工接手\u003c/h1>\n\u003cp>数据库保存任务与进度，消息队列通知执行，渠道结果不明时查询原退款编号。\u003c/p>\n\u003ch2 id=\"后台退款与人工接手\">后台退款与人工接手\u003c/h2>\n\u003cp>取消事务在 \u003ccode>refund_request\u003c/code> 之外同时插入 \u003ccode>refund_delivery\u003c/code>，后者也是持久投递记录；历史退款不自动补投。发布器沿用 Publisher Confirm 与 \u003ccode>SKIP LOCKED\u003c/code> 的方式通知 RabbitMQ，任务完成前可再次投递，同一消息不代表一次新的退款。两个消费者以数据库条件更新取得 30 秒租约，新的 leaseToken 阻止恢复后的旧工作线程覆盖新任务。领取和结果提交使用短事务，HTTP 在事务外执行。\u003c/p>\n\u003ch2 id=\"查询优先与人工接手\">查询优先与人工接手\u003c/h2>\n\u003cp>消费者每次先查询稳定的退款 publicId。只有渠道明确返回未受理，或管理员已将明确失败的旧批次推进为下一批次时，才允许提交。同一业务退款编号、金额和批次由独立渠道检查；超时与异常保持 WAITING，每 5 秒再核验，发布器每 2 秒扫描。10 分钟仍无法得到结果时，事务内创建幂等人工工单并标记 MANUAL，支付仍为 PROCESSING。管理员可以恢复核验；这个动作沿用原编号并先查询，不能把“未知”直接改为“失败重退”。\u003c/p>\n\u003ch2 id=\"回调旧批次与渠道边界\">回调、旧批次与渠道边界\u003c/h2>\n\u003cp>渠道回调需独立凭证，仍复用原有金额、eventId、attemptNo、终态校验；过期租约结果和旧批次回调不能覆盖新状态。已成功退款、重复消息、重复回调不会重复改款。当前渠道是独立持久化的本地模拟服务，支持响应丢失、回调丢失、明确失败、长时间处理中和进程重启；这些结果不能宣称已经对接真实支付机构。\u003c/p>\n\u003ch2 id=\"客服如何接续处理\">客服如何接续处理\u003c/h2>\n\u003cp>退款转人工后，订单详情的 \u003ccode>refundReview\u003c/code> 返回原工单编号、核验进度、顾客回复和更新时间。查询通过原退款编号派生的稳定 \u003ccode>source_action_id\u003c/code> 定位工单，并再次限制订单及工单所属客户，不依赖原聊天或任务上的可空工单指针。重新核验、失败重试保留工单关联，最终进度依据退款渠道状态显示。新会话查询本人订单也会返回同一工单。客服通过运营中心“回复顾客”显式发布消息，V12 新增 \u003ccode>customer_message\u003c/code>，既有内部备注不会自动公开。\u003c/p>\n\u003cp>复现入口为 \u003ccode>scripts/evaluation/refund_delivery.py --allow-isolated-faults\u003c/code>，使用专用 Compose 项目、数据库及端口。CI 同时运行真实消息队列和浏览器人工接手测试，报告只发布合成数据的检查摘要。\u003c/p>\n\u003ch2 id=\"模型调用的取消边界\">模型调用的取消边界\u003c/h2>\n\u003cp>模型调用等待超时或上游线程被中断时，\u003ccode>AiCallExecutor\u003c/code> 显式取消 Future 并保留调用线程的中断标记。受测可响应中断任务不会在返回超时后继续堆积；这不代表外部服务已经停止执行或停止计费，退款等已提交业务仍依靠稳定编号和结果核验恢复。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/RefundDeliveryService.java\" target=\"_blank\" rel=\"noopener noreferrer\">RefundDeliveryService\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/RefundDispatcher.java\" target=\"_blank\" rel=\"noopener noreferrer\">RefundDispatcher\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/RefundChannelClient.java\" target=\"_blank\" rel=\"noopener noreferrer\">RefundChannelClient\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/RefundServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">RefundServiceImpl\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"异步退款与人工接手 数据库保存任务与进度，消息队列通知执行，渠道结果不明时查询原退款编号。 后台退款与人工接手 取消事务在 `refund_request` 之外同时插入 `refund_delivery`，后者也是持久投递记录；历史退款不自动补投。发布器沿用 Publisher Confirm 与 `SKIP LOCKED` 的方式通知 RabbitMQ，任务完成前可再次投递，同一消息不代表一次新的退款。两个消费者以数据库条件更新取得 30 秒租约，新的 leaseToken 阻止恢复后的旧工作线程覆盖新任务。领取和结果提交使用短事务，HTTP 在事务外执行。 查询优先与人工接手 消费者每次先查询稳定的退款 publicId。只有渠道明确返回未受理，或管理员已将明确失败的旧批次推进为下一批次时，才允许提交。同一业务退款编号、金额和批次由独立渠道检查；超时与异常保持 WAITING，每 5 秒再核验，发布器每 2 秒扫描。10 分钟仍无法得到结果时，事务内创建幂等人工工单并标记 MANUAL，支付仍为 PROCESSING。管理员可以恢复核验；这个动作沿用原编号并先查询，不能把“未知”直接改为“失败重退”。 回调、旧批次与渠道边界 渠道回调需独立凭证，仍复用原有金额、eventId、attemptNo、终态校验；过期租约结果和旧批次回调不能覆盖新状态。已成功退款、重复消息、重复回调不会重复改款。当前渠道是独立持久化的本地模拟服务，支持响应丢失、回调丢失、明确失败、长时间处理中和进程重启；这些结果不能宣称已经对接真实支付机构。 客服如何接续处理 退款转人工后，订单详情的 `refundReview` 返回原工单编号、核验进度、顾客回复和更新时间。查询通过原退款编号派生的稳定 `source_action_id` 定位工单，并再次限制订单及工单所属客户，不依赖原聊天或任务上的可空工单指针。重新核验、失败重试保留工单关联，最终进度依据退款渠道状态显示。新会话查询本人订单也会返回同一工单。客服通过运营中心“回复顾客”显式发布消息，V12 新增 `customer_message`，既有内部备注不会自动公开。 复现入口为 `scripts/evaluation/refund_delivery.py --allow-isolated-faults`，使用专用 Compose 项目、数据库及端口。CI 同时运行真实消息队列和浏览器人工接手测试，报告只发布合成数据的检查摘要。 模型调用的取消边界 模型调用等待超时或上游线程被中断时，`AiCallExecutor` 显式取消 Future 并保留调用线程的中断标记。受测可响应中断任务不会在返回超时后继续堆积；这不代表外部服务已经停止执行或停止计费，退款等已提交业务仍依靠稳定编号和结果核验恢复。 源码阅读入口 RefundDeliveryService RefundDispatcher RefundChannelClient RefundServiceImpl"},{"id":"after-sales","group":"Agent 与业务执行","title":"工单对话与退货","headings":[{"title":"顾客与客服的持续工单对话","id":"顾客与客服的持续工单对话","level":"h2"},{"title":"回复去重与状态转换","id":"回复去重与状态转换","level":"h3"},{"title":"收货后的单件全额退货","id":"收货后的单件全额退货","level":"h2"},{"title":"验收与退款事务","id":"验收与退款事务","level":"h3"},{"title":"并发与原编号复用","id":"并发与原编号复用","level":"h3"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"工单对话与退货\">工单对话与退货\u003c/h1>\n\u003cp>顾客和客服通过持久工单继续协作，退货验收复用同一退款执行链路。\u003c/p>\n\u003ch2 id=\"顾客与客服的持续工单对话\">顾客与客服的持续工单对话\u003c/h2>\n\u003cp>\u003ccode>GET /tickets\u003c/code> 与详情接口按登录客户限制归属，管理员从独立接口接手与回复。\u003ccode>ticket_message\u003c/code> 保存 CUSTOMER/SUPPORT 消息，内部 \u003ccode>resolution_note\u003c/code> 不出现在顾客详情中。列表和详情分别限制最近 200 张工单、最近 200 条消息。\u003c/p>\n\u003ch3 id=\"回复去重与状态转换\">回复去重与状态转换\u003c/h3>\n\u003cp>发送回复先锁工单，再检查状态和消息 UUID。重复 UUID 仅在工单、角色和内容一致时返回原结果，不能用同一编号改变内容。顾客在 RESOLVED 后补充消息，会在同一事务将状态恢复为 ASSIGNED；顾客确认解决只允许 RESOLVED→CLOSED，重复关闭返回原结果。已关闭工单拒绝追加回复。\u003c/p>\n\u003cp>前端在响应不明时保留原回复 UUID，重试沿用它；路由变化时不把旧工单请求的结果更新到新工单。V14 将历史上已明确发布的 \u003ccode>customer_message\u003c/code> 迁入会话，内部备注不迁为公开消息。\u003c/p>\n\u003ch2 id=\"收货后的单件全额退货\">收货后的单件全额退货\u003c/h2>\n\u003cp>客户在订单详情提交原因，\u003ccode>POST /orders/{orderNo}/return\u003c/code> 从登录身份检查订单归属。首版每单一张申请，仅接受已签收、已付款、无退款且只有一条商品明细、数量为 1 的订单。金额取订单实付总额，商品名称与金额在申请中留存。重复申请返回原单，包括已拒绝或完成的申请。\u003c/p>\n\u003ch3 id=\"验收与退款事务\">验收与退款事务\u003c/h3>\n\u003cp>客服在退货处理页填写顾客可见的退回指引或拒绝原因。\u003ccode>REQUESTED → APPROVED / REJECTED\u003c/code> 审核决定持久保存，重复相同决定返回原结果，冲突决定拒绝。退回商品由顾客按指引自行寄送或交回，客服确认实物验收并填写结果后，\u003ccode>APPROVED → RECEIVED\u003c/code>、付款退款状态、唯一全额退款请求和后台投递任务在同一事务提交。金额依据发生变化或任一写入失败会回滚收货与退款记录。\u003c/p>\n\u003ch3 id=\"并发与原编号复用\">并发与原编号复用\u003c/h3>\n\u003cp>退货写入先锁订单，再锁退货单，并采用 READ COMMITTED，使等待并发请求提交后读取到其最新结果。退货编号复用为退款编号，重复收货直接返回原结果。收货后的退款沿用查询优先、回调幂等、失败重试和人工核验流程，退款最终状态从既有退款记录读取。订单详情和订单咨询返回同一 \u003ccode>returnRequest\u003c/code>，包括审核指引、验收记录及退款进度。客服审核和实物验收由管理员执行。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/TicketServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">TicketServiceImpl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/ReturnService.java\" target=\"_blank\" rel=\"noopener noreferrer\">ReturnService\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"工单对话与退货 顾客和客服通过持久工单继续协作，退货验收复用同一退款执行链路。 顾客与客服的持续工单对话 `GET /tickets` 与详情接口按登录客户限制归属，管理员从独立接口接手与回复。`ticket_message` 保存 CUSTOMER/SUPPORT 消息，内部 `resolution_note` 不出现在顾客详情中。列表和详情分别限制最近 200 张工单、最近 200 条消息。 回复去重与状态转换 发送回复先锁工单，再检查状态和消息 UUID。重复 UUID 仅在工单、角色和内容一致时返回原结果，不能用同一编号改变内容。顾客在 RESOLVED 后补充消息，会在同一事务将状态恢复为 ASSIGNED；顾客确认解决只允许 RESOLVED→CLOSED，重复关闭返回原结果。已关闭工单拒绝追加回复。 前端在响应不明时保留原回复 UUID，重试沿用它；路由变化时不把旧工单请求的结果更新到新工单。V14 将历史上已明确发布的 `customer_message` 迁入会话，内部备注不迁为公开消息。 收货后的单件全额退货 客户在订单详情提交原因，`POST /orders/{orderNo}/return` 从登录身份检查订单归属。首版每单一张申请，仅接受已签收、已付款、无退款且只有一条商品明细、数量为 1 的订单。金额取订单实付总额，商品名称与金额在申请中留存。重复申请返回原单，包括已拒绝或完成的申请。 验收与退款事务 客服在退货处理页填写顾客可见的退回指引或拒绝原因。`REQUESTED → APPROVED / REJECTED` 审核决定持久保存，重复相同决定返回原结果，冲突决定拒绝。退回商品由顾客按指引自行寄送或交回，客服确认实物验收并填写结果后，`APPROVED → RECEIVED`、付款退款状态、唯一全额退款请求和后台投递任务在同一事务提交。金额依据发生变化或任一写入失败会回滚收货与退款记录。 并发与原编号复用 退货写入先锁订单，再锁退货单，并采用 READ COMMITTED，使等待并发请求提交后读取到其最新结果。退货编号复用为退款编号，重复收货直接返回原结果。收货后的退款沿用查询优先、回调幂等、失败重试和人工核验流程，退款最终状态从既有退款记录读取。订单详情和订单咨询返回同一 `returnRequest`，包括审核指引、验收记录及退款进度。客服审核和实物验收由管理员执行。 源码阅读入口 TicketServiceImpl ReturnService"},{"id":"knowledge","group":"知识与 RAG","title":"知识上传与版本切换","headings":[{"title":"知识入库时序","id":"知识入库时序","level":"h2"},{"title":"领取、续租与重建","id":"领取续租与重建","level":"h2"},{"title":"激活条件与跨存储边界","id":"激活条件与跨存储边界","level":"h2"},{"title":"源码阅读入口","id":"源码阅读入口","level":"h2"}],"html":"\u003ch1 id=\"知识上传与版本切换\">知识上传与版本切换\u003c/h1>\n\u003cp>上传、异步解析和活动版本切换各有明确的持久状态，失败版本不覆盖正在服务的知识。\u003c/p>\n\u003ch2 id=\"知识入库时序\">知识入库时序\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">上传 → MySQL document/version=PENDING + Outbox=PENDING（同一事务）\n     → Publisher Confirm → RabbitMQ\n     → Consumer 幂等解析/Tika/Chunk/Embedding/Milvus\n     → READY → 原子切换 active_version_id\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"领取续租与重建\">领取、续租与重建\u003c/h2>\n\u003cp>上传先锁文档行再分配版本号，每个源文件使用独立路径，事务回滚清理本次新文件。消费者通过 PENDING→PROCESSING 领取任务，使用三分钟租约并在分块前续期。30 秒一次的恢复扫描处理超时任务，最多自动尝试三次。重试复制源文件引用，创建新版本编号和 Outbox 记录，旧任务的向量写入因此与新尝试隔离。已发布但一直未领取的 PENDING 通知会重新投递；连续五次发布失败则标记 FAILED，支持人工重建。\u003c/p>\n\u003ch2 id=\"激活条件与跨存储边界\">激活条件与跨存储边界\u003c/h2>\n\u003cp>只有持有有效租约的 PROCESSING 版本能变为 READY。激活时按版本号单调推进，旧版本晚完成不会覆盖已生效的新版本；旧内容已经有更新上传时，也不会自动重建旧内容。新版本完整入库前，原活动版本继续服务。MySQL、文件和 Milvus 仍是独立存储，历史失败版本及其向量保留用于追溯，不宣称跨存储 exactly-once。\u003c/p>\n\u003ch2 id=\"源码阅读入口\">源码阅读入口\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/service/impl/KnowledgeServiceImpl.java\" target=\"_blank\" rel=\"noopener noreferrer\">KnowledgeServiceImpl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/KnowledgeOutboxPublisher.java\" target=\"_blank\" rel=\"noopener noreferrer\">KnowledgeOutboxPublisher\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/DocumentConsumer.java\" target=\"_blank\" rel=\"noopener noreferrer\">DocumentConsumer\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/KnowledgeRecovery.java\" target=\"_blank\" rel=\"noopener noreferrer\">KnowledgeRecovery\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/infrastructure/messaging/KnowledgeChunker.java\" target=\"_blank\" rel=\"noopener noreferrer\">KnowledgeChunker\u003c/a>\u003c/li>\n\u003c/ul>\n","text":"知识上传与版本切换 上传、异步解析和活动版本切换各有明确的持久状态，失败版本不覆盖正在服务的知识。 知识入库时序 上传 → MySQL document/version=PENDING + Outbox=PENDING（同一事务） → Publisher Confirm → RabbitMQ → Consumer 幂等解析/Tika/Chunk/Embedding/Milvus → READY → 原子切换 active_version_id 领取、续租与重建 上传先锁文档行再分配版本号，每个源文件使用独立路径，事务回滚清理本次新文件。消费者通过 PENDING→PROCESSING 领取任务，使用三分钟租约并在分块前续期。30 秒一次的恢复扫描处理超时任务，最多自动尝试三次。重试复制源文件引用，创建新版本编号和 Outbox 记录，旧任务的向量写入因此与新尝试隔离。已发布但一直未领取的 PENDING 通知会重新投递；连续五次发布失败则标记 FAILED，支持人工重建。 激活条件与跨存储边界 只有持有有效租约的 PROCESSING 版本能变为 READY。激活时按版本号单调推进，旧版本晚完成不会覆盖已生效的新版本；旧内容已经有更新上传时，也不会自动重建旧内容。新版本完整入库前，原活动版本继续服务。MySQL、文件和 Milvus 仍是独立存储，历史失败版本及其向量保留用于追溯，不宣称跨存储 exactly-once。 源码阅读入口 KnowledgeServiceImpl KnowledgeOutboxPublisher DocumentConsumer KnowledgeRecovery KnowledgeChunker"},{"id":"rag","group":"知识与 RAG","title":"检索、重排与证据回答","headings":[{"title":"检索链路","id":"检索链路","level":"h2"},{"title":"范围与版本先于相似度","id":"范围与版本先于相似度","level":"h2"},{"title":"为什么修正中文分词","id":"为什么修正中文分词","level":"h2"},{"title":"各阶段失败时发生什么","id":"各阶段失败时发生什么","level":"h2"},{"title":"为什么模型只返回事实编号","id":"为什么模型只返回事实编号","level":"h2"},{"title":"诊断与源码","id":"诊断与源码","level":"h2"}],"html":"\u003ch1 id=\"检索重排与证据回答\">检索、重排与证据回答\u003c/h1>\n\u003cp>RAG 解决文档知识问题，MySQL 提供商品和业务事实。两者在回答前汇合，但不能互相冒充权威来源。\u003c/p>\n\u003ch2 id=\"检索链路\">检索链路\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">原问题 + 本轮商品范围 + 文档类型 + 活动版本\n  → Dense Top 20 / 中文 BM25 Top 20\n  → RRF (k=60)，保留 Top 20\n  → Reranker Top 5\n  → Grader 按原问题判断证据充分性\n  → 若不足，最多改写一次并重新检索\n  → 模型选择事实编号 → 后端校验并拼接原文\n\u003c/code>\u003c/pre>\n\u003cp>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/rag/MilvusRagService.java\" target=\"_blank\" rel=\"noopener noreferrer\">MilvusRagService\u003c/a> 负责检索、重排和充分性判定；\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/ai/GroundedAnswerComposer.java\" target=\"_blank\" rel=\"noopener noreferrer\">GroundedAnswerComposer\u003c/a> 负责最终事实编号协议。工作流决定查哪一类文档和哪个商品，检索服务不会自己扩大商品范围。\u003c/p>\n\u003ch2 id=\"范围与版本先于相似度\">范围与版本先于相似度\u003c/h2>\n\u003cp>每次检索固定 \u003ccode>documentType\u003c/code>、\u003ccode>productId\u003c/code> 和 MySQL 返回的活动 \u003ccode>documentVersionId\u003c/code>。显式切换型号或输入未知 SKU 时，工作流更新或清除旧商品记忆，防止上一轮商品进入事实池。\u003c/p>\n\u003cp>第一轮和改写后的第二轮共用范围与活动版本。改写可以改变检索词，Grader 始终回答原问题；否则模型可能通过换一个容易的问题来错误地判为“充分”。\u003c/p>\n\u003ch2 id=\"为什么修正中文分词\">为什么修正中文分词\u003c/h2>\n\u003cp>新 Collection 使用 Milvus 内置 \u003ccode>chinese\u003c/code> analyzer。旧 \u003ccode>standard\u003c/code> 配置在这批中文资料上保留了过长的连续词项，削弱 BM25 的匹配效果。集合创建时声明分词器还不够：对已存在的集合也检查 analyzer，配置不符则明确报错。\u003c/p>\n\u003cp>现有标准分词集合不会被自动删除或重建。迁移时显式指定新的 \u003ccode>MILVUS_COLLECTION_NAME\u003c/code>，重新入库并验证，再切换使用；步骤见 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/rag-v2-protocol.md\" target=\"_blank\" rel=\"noopener noreferrer\">RAG v2 协议\u003c/a>。惰性初始化在并发锁内完成，全部步骤成功后才发布就绪标记。\u003c/p>\n\u003ch2 id=\"各阶段失败时发生什么\">各阶段失败时发生什么\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>没有活动版本或候选\u003c/td>\n\u003ctd>返回无证据，不用模型常识补齐参数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reranker 失败\u003c/td>\n\u003ctd>保留融合排名前五，记录 degraded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grader 失败\u003c/td>\n\u003ctd>保留候选，判为不足并记录 degraded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改写没有变化\u003c/td>\n\u003ctd>直接使用首轮结果，不重复调用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改写或第二轮失败\u003c/td>\n\u003ctd>保留首轮证据，标记不足和降级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续阶段成功\u003c/td>\n\u003ctd>不抹掉之前发生过的降级标记\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>默认业务路径启用混合检索、重排和有界改写；评测接口另外支持 BM25、DENSE、HYBRID、HYBRID_RERANK、HYBRID_RERANK_REWRITE，便于单独比较检索与后处理成本。BM25 基线不请求 Embedding。\u003c/p>\n\u003ch2 id=\"为什么模型只返回事实编号\">为什么模型只返回事实编号\u003c/h2>\n\u003cp>后端为目录事实和检索段落分配编号。模型最多选择 5 个编号，后端检查编号是否属于本轮上下文，再组织原始事实与来源，避免模型自由扩写参数或截掉使用条件。正文在选择完成后发送，因此界面的 token 事件不等同于逐 token 转发自由生成文本。\u003c/p>\n\u003cp>这只能约束回答内容的来源。选择了无关段落、漏掉必需条件、错误地判为不足，依然会导致回答不合格；原始资料本身的错误也不会自动纠正。评测必须同时检查检索、上下文覆盖和最终选择。\u003c/p>\n\u003ch2 id=\"诊断与源码\">诊断与源码\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/rag/RagTraceRecorder.java\" target=\"_blank\" rel=\"noopener noreferrer\">RagTraceRecorder\u003c/a> 保存每阶段 query、输入/输出分块、原因、充分性、降级和耗时。正文与完整证据仅在受控的本地诊断产物中保存；普通 SSE 的 \u003ccode>rag_evidence\u003c/code> 只提供分块编号与来源。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/rag/OpenAiCompatibleEmbeddingModel.java\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAiCompatibleEmbeddingModel\u003c/a>：Embedding 响应解析。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/rag/OpenAiRerankerClient.java\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAiRerankerClient\u003c/a>：百炼原生 Rerank 协议。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/ai/CloudAiGateway.java\" target=\"_blank\" rel=\"noopener noreferrer\">CloudAiGateway\u003c/a>：Grader 与改写提示词。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/test/java/com/serviceflow/rag/RagRewriteDiagnosticsTest.java\" target=\"_blank\" rel=\"noopener noreferrer\">RagRewriteDiagnosticsTest\u003c/a>：五种配置、范围约束、二轮原问题判定与降级。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/test/java/com/serviceflow/ai/CloudEvidenceSafetyTest.java\" target=\"_blank\" rel=\"noopener noreferrer\">CloudEvidenceSafetyTest\u003c/a>：受约束回答的安全边界。\u003c/li>\n\u003c/ul>\n","text":"检索、重排与证据回答 RAG 解决文档知识问题，MySQL 提供商品和业务事实。两者在回答前汇合，但不能互相冒充权威来源。 检索链路 原问题 + 本轮商品范围 + 文档类型 + 活动版本 → Dense Top 20 / 中文 BM25 Top 20 → RRF (k=60)，保留 Top 20 → Reranker Top 5 → Grader 按原问题判断证据充分性 → 若不足，最多改写一次并重新检索 → 模型选择事实编号 → 后端校验并拼接原文 MilvusRagService 负责检索、重排和充分性判定；GroundedAnswerComposer 负责最终事实编号协议。工作流决定查哪一类文档和哪个商品，检索服务不会自己扩大商品范围。 范围与版本先于相似度 每次检索固定 `documentType`、`productId` 和 MySQL 返回的活动 `documentVersionId`。显式切换型号或输入未知 SKU 时，工作流更新或清除旧商品记忆，防止上一轮商品进入事实池。 第一轮和改写后的第二轮共用范围与活动版本。改写可以改变检索词，Grader 始终回答原问题；否则模型可能通过换一个容易的问题来错误地判为“充分”。 为什么修正中文分词 新 Collection 使用 Milvus 内置 `chinese` analyzer。旧 `standard` 配置在这批中文资料上保留了过长的连续词项，削弱 BM25 的匹配效果。集合创建时声明分词器还不够：对已存在的集合也检查 analyzer，配置不符则明确报错。 现有标准分词集合不会被自动删除或重建。迁移时显式指定新的 `MILVUS_COLLECTION_NAME`，重新入库并验证，再切换使用；步骤见 RAG v2 协议。惰性初始化在并发锁内完成，全部步骤成功后才发布就绪标记。 各阶段失败时发生什么 阶段 处理 没有活动版本或候选 返回无证据，不用模型常识补齐参数 Reranker 失败 保留融合排名前五，记录 degraded Grader 失败 保留候选，判为不足并记录 degraded 改写没有变化 直接使用首轮结果，不重复调用 改写或第二轮失败 保留首轮证据，标记不足和降级 后续阶段成功 不抹掉之前发生过的降级标记 默认业务路径启用混合检索、重排和有界改写；评测接口另外支持 BM25、DENSE、HYBRID、HYBRID_RERANK、HYBRID_RERANK_REWRITE，便于单独比较检索与后处理成本。BM25 基线不请求 Embedding。 为什么模型只返回事实编号 后端为目录事实和检索段落分配编号。模型最多选择 5 个编号，后端检查编号是否属于本轮上下文，再组织原始事实与来源，避免模型自由扩写参数或截掉使用条件。正文在选择完成后发送，因此界面的 token 事件不等同于逐 token 转发自由生成文本。 这只能约束回答内容的来源。选择了无关段落、漏掉必需条件、错误地判为不足，依然会导致回答不合格；原始资料本身的错误也不会自动纠正。评测必须同时检查检索、上下文覆盖和最终选择。 诊断与源码 RagTraceRecorder 保存每阶段 query、输入/输出分块、原因、充分性、降级和耗时。正文与完整证据仅在受控的本地诊断产物中保存；普通 SSE 的 `rag_evidence` 只提供分块编号与来源。 OpenAiCompatibleEmbeddingModel：Embedding 响应解析。 OpenAiRerankerClient：百炼原生 Rerank 协议。 CloudAiGateway：Grader 与改写提示词。 RagRewriteDiagnosticsTest：五种配置、范围约束、二轮原问题判定与降级。 CloudEvidenceSafetyTest：受约束回答的安全边界。"},{"id":"evaluation","group":"知识与 RAG","title":"RAG 数据集与真实评测","headings":[{"title":"题目与证据标签如何构建","id":"题目与证据标签如何构建","level":"h2"},{"title":"一次评测如何执行","id":"一次评测如何执行","level":"h2"},{"title":"指标的分母","id":"指标的分母","level":"h2"},{"title":"最新真实结果","id":"最新真实结果","level":"h2"},{"title":"什么收益能归因","id":"什么收益能归因","level":"h2"},{"title":"继续验证什么","id":"继续验证什么","level":"h2"}],"html":"\u003ch1 id=\"rag-数据集与真实评测\">RAG 数据集与真实评测\u003c/h1>\n\u003cp>检索指标回答“相关证据有没有被找出来”，答案规则回答“最终选择是否符合标签”，业务验收回答“操作是否正确执行”。这三类结果分别报告。\u003c/p>\n\u003ch2 id=\"题目与证据标签如何构建\">题目与证据标签如何构建\u003c/h2>\n\u003cp>语料来自已入库的公开商品资料。\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/datasets/rag-retrieval-v2.json\" target=\"_blank\" rel=\"noopener noreferrer\">v2 数据集\u003c/a> 保留每份来源的哈希、v1 父版本和修订前问题，以资料章节、事实编号和完整参考段落建立可追溯标签。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>104 条修订回归题\u003c/strong>：已用于诊断；其中 13 条澄清问法，20 条补充明确允许的事实范围。\u003c/li>\n\u003cli>\u003cstrong>40 条冻结新题\u003c/strong>：19 条单证据、11 条多证据、10 条无答案题。首次运行前提交冻结，本轮不根据输出调参或修改标签。\u003c/li>\n\u003cli>\u003cstrong>必需 / 可选 / 禁止事实\u003c/strong>：可选补充不能弥补必需事实遗漏；禁止事实用于识别错误范围。无答案题单独检查拒答。\u003c/li>\n\u003c/ul>\n\u003cp>新题使用已知来源，没有与回归集共享问题，但不是新来源留出或独立人工标注基准。商品与版本过滤后每题通常只有约 8 个章节，不能把这里的满召回外推到大知识库。\u003c/p>\n\u003ch2 id=\"一次评测如何执行\">一次评测如何执行\u003c/h2>\n\u003col>\n\u003cli>固定代码、数据哈希、模型、参数、资料与活动版本。\u003c/li>\n\u003cli>管理员通过显式开启的 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/controller/RagEvaluationController.java\" target=\"_blank\" rel=\"noopener noreferrer\">RagEvaluationController\u003c/a> 执行固定商品问答。只提供名称/SKU，避免目录参数直接代答。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/scripts/evaluation/rag_benchmark.py\" target=\"_blank\" rel=\"noopener noreferrer\">rag_benchmark.py\u003c/a> 按固定随机种子和轮换配置顺序发请求，预热独立标记，正式每题每配置只测一次、并发为 1。\u003c/li>\n\u003cli>用诊断编号关联各阶段 trace 和完整分块，验证商品与版本，再由 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/scripts/evaluation/rag_metrics.py\" target=\"_blank\" rel=\"noopener noreferrer\">rag_metrics.py\u003c/a> 离线计算指标。\u003c/li>\n\u003cli>供应商请求受全局预算控制，发生供应商错误停止，不自动补跑；失败与未执行项保留在计划分母中。\u003c/li>\n\u003c/ol>\n\u003cp>v1 比较五种配置，包括有界改写。v2 使用修订标签，比较中文 BM25、向量、混合、混合加重排四组，\u003cstrong>不启用改写\u003c/strong>。不能称为 v2 五组对照。\u003c/p>\n\u003ch2 id=\"指标的分母\">指标的分母\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>含义与范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Recall@5\u003c/td>\n\u003ctd>可回答题所需章节在前五候选中的覆盖比例，再做逐题宏平均\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MRR@5\u003c/td>\n\u003ctd>前五中第一个相关章节排名的倒数；没有命中计 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>答案规则通过率\u003c/td>\n\u003ctd>必需事实、允许范围、禁止事实和不足标记是否满足冻结规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文覆盖\u003c/td>\n\u003ctd>Grader 后保留下来的证据能否覆盖所需事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P95\u003c/td>\n\u003ctd>单并发完整 HTTP 耗时，含检索、模型与诊断写入，排除预热\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求量\u003c/td>\n\u003ctd>实际供应商请求数，包含入库、预热、正式问答；不是估算 token 或账单\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>本轮没有独立 LLM-as-Judge 或人工语义正确率。固定商品评测也不覆盖完整 Agent 意图路由、用户上下文与工具执行。\u003c/p>\n\u003ch2 id=\"最新真实结果\">最新真实结果\u003c/h2>\n\u003cp>2026-11-16 完成 144 题 × 4 配置，576 次正式问答、4 次预热，调用错误为 0；含入库共 1932 次供应商请求。完整统计与失败案例以 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/results/rag-retrieval-v2-2026-11-16.md\" target=\"_blank\" rel=\"noopener noreferrer\">v2 报告\u003c/a> 和 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/results/rag-retrieval-v2-2026-11-16.json\" target=\"_blank\" rel=\"noopener noreferrer\">JSON\u003c/a> 为准。\u003c/p>\n\u003cp>40 条冻结新题的摘要如下，Recall/MRR 分母为其中 30 道可回答题，规则通过率分母为 40：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>配置\u003c/th>\n\u003cth style=\"text-align:right\">Recall@5\u003c/th>\n\u003cth style=\"text-align:right\">MRR@5\u003c/th>\n\u003cth style=\"text-align:right\">规则通过\u003c/th>\n\u003cth style=\"text-align:right\">P95\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>中文 BM25\u003c/td>\n\u003ctd style=\"text-align:right\">100%\u003c/td>\n\u003ctd style=\"text-align:right\">0.9611\u003c/td>\n\u003ctd style=\"text-align:right\">39/40\u003c/td>\n\u003ctd style=\"text-align:right\">2.930 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>向量\u003c/td>\n\u003ctd style=\"text-align:right\">100%\u003c/td>\n\u003ctd style=\"text-align:right\">0.9833\u003c/td>\n\u003ctd style=\"text-align:right\">39/40\u003c/td>\n\u003ctd style=\"text-align:right\">3.238 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中文混合\u003c/td>\n\u003ctd style=\"text-align:right\">100%\u003c/td>\n\u003ctd style=\"text-align:right\">0.9667\u003c/td>\n\u003ctd style=\"text-align:right\">39/40\u003c/td>\n\u003ctd style=\"text-align:right\">3.401 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中文混合 + 重排\u003c/td>\n\u003ctd style=\"text-align:right\">100%\u003c/td>\n\u003ctd style=\"text-align:right\">0.9833\u003c/td>\n\u003ctd style=\"text-align:right\">39/40\u003c/td>\n\u003ctd style=\"text-align:right\">3.330 s\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>四组共同的失败是额外选入了本题标签禁止的有线快充段落，而用户询问无线充电配套。必需事实已找到，问题出在回答范围；这说明满召回不代表每个回答都合格。\u003c/p>\n\u003ch2 id=\"什么收益能归因\">什么收益能归因\u003c/h2>\n\u003cp>使用完全相同的 v2 问题和文档，直接比较 standard/chinese 两个集合：126 道可回答题的 BM25 Recall@5 从 \u003cstrong>56.75% 到 100%\u003c/strong>，MRR@5 从 \u003cstrong>0.3657 到 0.9828\u003c/strong>。这个本地配对不经过答案模型，没有额外云调用，能够分离分词配置的影响。\u003c/p>\n\u003cp>本轮未证明混合或重排增加了新题回答通过数，四组均为 39/40。v1 与 v2 的问题、标签不同，不能直接相减来宣称回答质量提升；v1 原始记录仍按旧规则重算一致。默认业务检索链路也没有因为单轮结果被自动切换。\u003c/p>\n\u003ch2 id=\"继续验证什么\">继续验证什么\u003c/h2>\n\u003cp>优先补来源不同、候选更多、容易混淆的证据，并对范围超出和不足标记做人工复核。新的付费评测需要单独确认范围与预算，不能为了增加简历数字反复重跑并挑选成绩。\u003c/p>\n\u003cp>历史 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/results/rag-retrieval-ablation-2026-11-16.md\" target=\"_blank\" rel=\"noopener noreferrer\">v1 五组对照\u003c/a>、\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/results/rag-context-followup-2026-10-25.md\" target=\"_blank\" rel=\"noopener noreferrer\">多轮上下文诊断\u003c/a> 和 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/results/cloud-business-recovery-2026-10-25.md\" target=\"_blank\" rel=\"noopener noreferrer\">业务恢复验收\u003c/a> 保持原口径。\u003c/p>\n","text":"RAG 数据集与真实评测 检索指标回答“相关证据有没有被找出来”，答案规则回答“最终选择是否符合标签”，业务验收回答“操作是否正确执行”。这三类结果分别报告。 题目与证据标签如何构建 语料来自已入库的公开商品资料。v2 数据集 保留每份来源的哈希、v1 父版本和修订前问题，以资料章节、事实编号和完整参考段落建立可追溯标签。 **104 条修订回归题**：已用于诊断；其中 13 条澄清问法，20 条补充明确允许的事实范围。 **40 条冻结新题**：19 条单证据、11 条多证据、10 条无答案题。首次运行前提交冻结，本轮不根据输出调参或修改标签。 **必需 / 可选 / 禁止事实**：可选补充不能弥补必需事实遗漏；禁止事实用于识别错误范围。无答案题单独检查拒答。 新题使用已知来源，没有与回归集共享问题，但不是新来源留出或独立人工标注基准。商品与版本过滤后每题通常只有约 8 个章节，不能把这里的满召回外推到大知识库。 一次评测如何执行 固定代码、数据哈希、模型、参数、资料与活动版本。 管理员通过显式开启的 RagEvaluationController 执行固定商品问答。只提供名称/SKU，避免目录参数直接代答。 rag_benchmark.py 按固定随机种子和轮换配置顺序发请求，预热独立标记，正式每题每配置只测一次、并发为 1。 用诊断编号关联各阶段 trace 和完整分块，验证商品与版本，再由 rag_metrics.py 离线计算指标。 供应商请求受全局预算控制，发生供应商错误停止，不自动补跑；失败与未执行项保留在计划分母中。 v1 比较五种配置，包括有界改写。v2 使用修订标签，比较中文 BM25、向量、混合、混合加重排四组，**不启用改写**。不能称为 v2 五组对照。 指标的分母 指标 含义与范围 Recall@5 可回答题所需章节在前五候选中的覆盖比例，再做逐题宏平均 MRR@5 前五中第一个相关章节排名的倒数；没有命中计 0 答案规则通过率 必需事实、允许范围、禁止事实和不足标记是否满足冻结规则 上下文覆盖 Grader 后保留下来的证据能否覆盖所需事实 P95 单并发完整 HTTP 耗时，含检索、模型与诊断写入，排除预热 请求量 实际供应商请求数，包含入库、预热、正式问答；不是估算 token 或账单 本轮没有独立 LLM-as-Judge 或人工语义正确率。固定商品评测也不覆盖完整 Agent 意图路由、用户上下文与工具执行。 最新真实结果 2026-11-16 完成 144 题 × 4 配置，576 次正式问答、4 次预热，调用错误为 0；含入库共 1932 次供应商请求。完整统计与失败案例以 v2 报告 和 JSON 为准。 40 条冻结新题的摘要如下，Recall/MRR 分母为其中 30 道可回答题，规则通过率分母为 40： 配置 Recall@5 MRR@5 规则通过 P95 中文 BM25 100% 0.9611 39/40 2.930 s 向量 100% 0.9833 39/40 3.238 s 中文混合 100% 0.9667 39/40 3.401 s 中文混合 + 重排 100% 0.9833 39/40 3.330 s 四组共同的失败是额外选入了本题标签禁止的有线快充段落，而用户询问无线充电配套。必需事实已找到，问题出在回答范围；这说明满召回不代表每个回答都合格。 什么收益能归因 使用完全相同的 v2 问题和文档，直接比较 standard/chinese 两个集合：126 道可回答题的 BM25 Recall@5 从 **56.75% 到 100%**，MRR@5 从 **0.3657 到 0.9828**。这个本地配对不经过答案模型，没有额外云调用，能够分离分词配置的影响。 本轮未证明混合或重排增加了新题回答通过数，四组均为 39/40。v1 与 v2 的问题、标签不同，不能直接相减来宣称回答质量提升；v1 原始记录仍按旧规则重算一致。默认业务检索链路也没有因为单轮结果被自动切换。 继续验证什么 优先补来源不同、候选更多、容易混淆的证据，并对范围超出和不足标记做人工复核。新的付费评测需要单独确认范围与预算，不能为了增加简历数字反复重跑并挑选成绩。 历史 v1 五组对照、多轮上下文诊断 和 业务恢复验收 保持原口径。"},{"id":"operations","group":"开发与验证","title":"运行、观测与排查","headings":[{"title":"启动入口","id":"启动入口","level":"h2"},{"title":"身份与接口","id":"身份与接口","level":"h2"},{"title":"观测先看哪一层","id":"观测先看哪一层","level":"h2"},{"title":"常见现象与处理","id":"常见现象与处理","level":"h2"},{"title":"数据与日志边界","id":"数据与日志边界","level":"h2"}],"html":"\u003ch1 id=\"运行观测与排查\">运行、观测与排查\u003c/h1>\n\u003cp>先决定运行的是业务 Demo 还是付费 Cloud 问答，再选择对应的配置与端口。两者的验证目的不同。\u003c/p>\n\u003ch2 id=\"启动入口\">启动入口\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>入口\u003c/th>\n\u003cth>地址与注意事项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>通用本地开发\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/guides/quickstart.md\" target=\"_blank\" rel=\"noopener noreferrer\">快速启动\u003c/a>\u003c/td>\n\u003ctd>Web 5173 / API 8080\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务恢复演示\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/guides/demo-script.md\" target=\"_blank\" rel=\"noopener noreferrer\">五分钟脚本\u003c/a>\u003c/td>\n\u003ctd>独立 Compose，Web 15173 / API 18080\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多轮业务与退款验收\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/guides/evaluation-and-refund.md\" target=\"_blank\" rel=\"noopener noreferrer\">隔离运行手册\u003c/a>\u003c/td>\n\u003ctd>使用合成账号、订单和专用数据库\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实 RAG 对照\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/evaluation/rag-v2-protocol.md\" target=\"_blank\" rel=\"noopener noreferrer\">评测协议\u003c/a>\u003c/td>\n\u003ctd>独立预算、冻结输入、出错停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本地 Grader 实验\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/training/README.md\" target=\"_blank\" rel=\"noopener noreferrer\">training/README\u003c/a>\u003c/td>\n\u003ctd>独立 CLI 与模型服务，不是主应用启动前置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>默认 Demo 不需要 API Key；其确定性回答用于检查业务链路，不能作为 RAG 模型效果。Cloud 的 Chat/Embedding 使用 OpenAI-compatible 协议，Reranker 使用百炼原生协议；变量名里的 OPENAI 不代表同时依赖两家供应商。\u003c/p>\n\u003ch2 id=\"身份与接口\">身份与接口\u003c/h2>\n\u003cp>JWT 区分 GUEST、CUSTOMER 和 ADMIN。客户查询从登录身份取得 customerId，不接受模型或浏览器指定其他用户；管理知识、退款处置和评测接口要求管理员。访客的会话、限流和请求去重主要保存在 Redis；正式会话和操作结果保存在 MySQL。\u003c/p>\n\u003cp>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/guides/api.md\" target=\"_blank\" rel=\"noopener noreferrer\">接口导航\u003c/a> 便于定位功能，完整字段以 Swagger 和对应 Controller 为准。取消订单必须经过待确认动作，读查询接口不能顺便执行取消或退款。\u003c/p>\n\u003ch2 id=\"观测先看哪一层\">观测先看哪一层\u003c/h2>\n\u003cul>\n\u003cli>HTTP 状态与 SSE 事件：先确认请求结束、超时，还是业务已提交但响应中断。\u003c/li>\n\u003cli>请求编号、动作编号和退款 publicId：串联浏览器、数据库与渠道，避免用新编号重试未知结果。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/java/com/serviceflow/rag/RagTraceRecorder.java\" target=\"_blank\" rel=\"noopener noreferrer\">RagTraceRecorder\u003c/a>：区分无召回、重排失败、Grader 不足和答案选择问题。\u003c/li>\n\u003cli>Outbox、版本状态和租约：区分“消息已发”与“数据已可用”。\u003c/li>\n\u003cli>Prometheus / Grafana / Jaeger：通过 Compose 的 observability profile 开启。首正文指标是服务端起点到首段正文，不是浏览器 TTFT。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"常见现象与处理\">常见现象与处理\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先核查\u003c/th>\n\u003cth>处理原则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>确认后页面没有结果\u003c/td>\n\u003ctd>持久动作结果、订单状态\u003c/td>\n\u003ctd>按原动作编号只读查询，不自动重发决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>退款一直处理中\u003c/td>\n\u003ctd>渠道原编号、任务租约、deadline、人工工单\u003c/td>\n\u003ctd>查询优先，不把超时当作失败后再退一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新文档上传后仍回答旧内容\u003c/td>\n\u003ctd>新版本是否 READY、active_version_id\u003c/td>\n\u003ctd>完整入库后才激活，旧版本暂时继续服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG 全部检索失败\u003c/td>\n\u003ctd>Collection、analyzer、向量维度、文档版本\u003c/td>\n\u003ctd>明确修复配置；旧集合不自动删除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recall 高但回答不合格\u003c/td>\n\u003ctd>Grader 后覆盖、所选编号、标签范围\u003c/td>\n\u003ctd>先定位错误阶段，不盲目增加检索步骤\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"数据与日志边界\">数据与日志边界\u003c/h2>\n\u003cp>\u003ccode>.env\u003c/code>、上传原文件、原始模型回答、JWT 和 API Key 不提交。原始评测在被忽略的 \u003ccode>quality/evaluation/reports/\u003c/code>，公开可核查的汇总在 \u003ccode>results/\u003c/code>。独立 AI 审计默认不复制问题与答案正文，但正式聊天历史仍存在，不能声称全系统匿名化。\u003c/p>\n\u003cp>故障注入只使用 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/runbooks/fault-drills.md\" target=\"_blank\" rel=\"noopener noreferrer\">专用演练\u003c/a> 指定的隔离环境。清理构建临时文件不等于清理数据卷、历史报告、训练数据或模型权重。\u003c/p>\n","text":"运行、观测与排查 先决定运行的是业务 Demo 还是付费 Cloud 问答，再选择对应的配置与端口。两者的验证目的不同。 启动入口 用途 入口 地址与注意事项 通用本地开发 快速启动 Web 5173 / API 8080 业务恢复演示 五分钟脚本 独立 Compose，Web 15173 / API 18080 多轮业务与退款验收 隔离运行手册 使用合成账号、订单和专用数据库 真实 RAG 对照 评测协议 独立预算、冻结输入、出错停止 本地 Grader 实验 training/README 独立 CLI 与模型服务，不是主应用启动前置 默认 Demo 不需要 API Key；其确定性回答用于检查业务链路，不能作为 RAG 模型效果。Cloud 的 Chat/Embedding 使用 OpenAI-compatible 协议，Reranker 使用百炼原生协议；变量名里的 OPENAI 不代表同时依赖两家供应商。 身份与接口 JWT 区分 GUEST、CUSTOMER 和 ADMIN。客户查询从登录身份取得 customerId，不接受模型或浏览器指定其他用户；管理知识、退款处置和评测接口要求管理员。访客的会话、限流和请求去重主要保存在 Redis；正式会话和操作结果保存在 MySQL。 接口导航 便于定位功能，完整字段以 Swagger 和对应 Controller 为准。取消订单必须经过待确认动作，读查询接口不能顺便执行取消或退款。 观测先看哪一层 HTTP 状态与 SSE 事件：先确认请求结束、超时，还是业务已提交但响应中断。 请求编号、动作编号和退款 publicId：串联浏览器、数据库与渠道，避免用新编号重试未知结果。 RagTraceRecorder：区分无召回、重排失败、Grader 不足和答案选择问题。 Outbox、版本状态和租约：区分“消息已发”与“数据已可用”。 Prometheus / Grafana / Jaeger：通过 Compose 的 observability profile 开启。首正文指标是服务端起点到首段正文，不是浏览器 TTFT。 常见现象与处理 现象 先核查 处理原则 确认后页面没有结果 持久动作结果、订单状态 按原动作编号只读查询，不自动重发决定 退款一直处理中 渠道原编号、任务租约、deadline、人工工单 查询优先，不把超时当作失败后再退一次 新文档上传后仍回答旧内容 新版本是否 READY、active_version_id 完整入库后才激活，旧版本暂时继续服务 RAG 全部检索失败 Collection、analyzer、向量维度、文档版本 明确修复配置；旧集合不自动删除 Recall 高但回答不合格 Grader 后覆盖、所选编号、标签范围 先定位错误阶段，不盲目增加检索步骤 数据与日志边界 `.env`、上传原文件、原始模型回答、JWT 和 API Key 不提交。原始评测在被忽略的 `quality/evaluation/reports/`，公开可核查的汇总在 `results/`。独立 AI 审计默认不复制问题与答案正文，但正式聊天历史仍存在，不能声称全系统匿名化。 故障注入只使用 专用演练 指定的隔离环境。清理构建临时文件不等于清理数据卷、历史报告、训练数据或模型权重。"},{"id":"verification","group":"开发与验证","title":"验证、性能与开发入口","headings":[{"title":"验证地图","id":"验证地图","level":"h2"},{"title":"测试从哪里读","id":"测试从哪里读","level":"h2"},{"title":"订单查询性能","id":"订单查询性能","level":"h2"},{"title":"文档如何维护","id":"文档如何维护","level":"h2"}],"html":"\u003ch1 id=\"验证性能与开发入口\">验证、性能与开发入口\u003c/h1>\n\u003cp>每种检查只能证明自己覆盖的部分。单元测试、真实数据库故障验收、浏览器操作和云模型评测分别保存结果。\u003c/p>\n\u003ch2 id=\"验证地图\">验证地图\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查\u003c/th>\n\u003cth>入口\u003c/th>\n\u003cth>能验证什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>后端离线检查\u003c/td>\n\u003ctd>\u003ccode>mvn -DskipITs verify\u003c/code>\u003c/td>\n\u003ctd>单元测试、格式、架构约束与覆盖率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MySQL 集成测试\u003c/td>\n\u003ctd>\u003ccode>mvn verify\u003c/code>\u003c/td>\n\u003ctd>Flyway、行锁、重复确认、事务和退款约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端\u003c/td>\n\u003ctd>\u003ccode>npm run lint\u003c/code>、\u003ccode>npm test\u003c/code>、\u003ccode>npm run build\u003c/code>\u003c/td>\n\u003ctd>类型、界面状态与产物构建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Python 评测契约\u003c/td>\n\u003ctd>\u003ccode>python -B -m unittest discover -s scripts/evaluation/tests\u003c/code>\u003c/td>\n\u003ctd>标签、分母、追踪解析与报告计算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实 API / 浏览器\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/.github/workflows/ci.yml\" target=\"_blank\" rel=\"noopener noreferrer\">CI\u003c/a> 与 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/guides/evaluation-and-refund.md\" target=\"_blank\" rel=\"noopener noreferrer\">运行手册\u003c/a>\u003c/td>\n\u003ctd>取消、恢复、退款渠道、工单和退货\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>云模型评测\u003c/td>\n\u003ctd>\u003ca href=\"#article/evaluation\">RAG 评测\u003c/a>\u003c/td>\n\u003ctd>冻结问题与模型配置下的实际行为\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>可选本地 Grader 验收需要模型服务；跳过不会成为通过证据。CI 使用 Demo 与本地模拟渠道，不调用付费模型。具体开发命令见 \u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/CONTRIBUTING.md\" target=\"_blank\" rel=\"noopener noreferrer\">CONTRIBUTING\u003c/a>。\u003c/p>\n\u003ch2 id=\"测试从哪里读\">测试从哪里读\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/test/java/com/serviceflow/ServiceFlowIntegrationIT.java\" target=\"_blank\" rel=\"noopener noreferrer\">ServiceFlowIntegrationIT\u003c/a>：确认与放弃竞争、幂等、退款租约和数据库结果。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/test/java/com/serviceflow/agent/OrderConversationTest.java\" target=\"_blank\" rel=\"noopener noreferrer\">OrderConversationTest\u003c/a>：查询计划、订单归属、候选选择和取消意图。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/test/java/com/serviceflow/rag/RagRewriteDiagnosticsTest.java\" target=\"_blank\" rel=\"noopener noreferrer\">RagRewriteDiagnosticsTest\u003c/a>：检索模式和原问题约束。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/tree/main/apps/serviceflow-web/e2e\" target=\"_blank\" rel=\"noopener noreferrer\">前端 E2E\u003c/a>：区分 mock 界面场景与真实后端场景。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/scripts/evaluation/refund_delivery.py\" target=\"_blank\" rel=\"noopener noreferrer\">refund_delivery.py\u003c/a>：独立渠道响应丢失、重复处理、租约和人工接手。\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/scripts/evaluation/recovery_demo.py\" target=\"_blank\" rel=\"noopener noreferrer\">recovery_demo.py\u003c/a>：事务已提交、响应缺失、缓存丢失与服务重启。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"订单查询性能\">订单查询性能\u003c/h2>\n\u003cp>原先将完整订单号放进模糊 keyword 条件，会扫描大量属于该客户的订单。增加 \u003ccode>orderNo\u003c/code> 精确参数后使用已有唯一索引；普通商品关键词仍保留模糊匹配语义。网页识别完整编号后选择精确参数，同一查询仍校验客户归属。\u003c/p>\n\u003cp>通过 EXPLAIN ANALYZE 核对扫描路径，在 \u003cstrong>100 万合成订单、单客户 20 万订单\u003c/strong> 的本地预热测试中，\u003cstrong>8 并发 HTTP P95 从 1.67 s 降到 10.4 ms\u003c/strong>。这是特定数据分布和完整订单号查询下的对照，不是所有订单查询或生产吞吐保证。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/quality/performance/reports/order-lookup-2026-11-04.json\" target=\"_blank\" rel=\"noopener noreferrer\">测量结果\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/tree/main/quality/performance\" target=\"_blank\" rel=\"noopener noreferrer\">性能场景\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/optimization-report-2026-11-04.md\" target=\"_blank\" rel=\"noopener noreferrer\">历史优化报告\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/apps/serviceflow-server/src/main/resources/mapper/OrderMapper.xml\" target=\"_blank\" rel=\"noopener noreferrer\">OrderMapper.xml\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"文档如何维护\">文档如何维护\u003c/h2>\n\u003cp>本 Wiki 的正文源文件在 \u003ccode>docs/wiki/\u003c/code>。修改 Markdown 后执行：\u003c/p>\n\u003cpre>\u003ccode class=\"language-powershell\"># 缺依赖时先在 apps/serviceflow-web 执行 npm ci\nnode scripts/docs/build-wiki.mjs\nnode scripts/docs/build-wiki.mjs --check\n\u003c/code>\u003c/pre>\n\u003cp>生成的 \u003ccode>docs/architecture-guide.html\u003c/code> 内嵌正文、搜索索引、样式和脚本，可直接离线打开。源码链接和外部报告需要打开仓库；Wiki 正文阅读与搜索不需要联网。不要直接编辑生成文件。\u003c/p>\n\u003cp>README 只介绍定位与入口；指南保存操作步骤；Wiki 解释当前设计；ADR 保存决策理由；历史报告与实验结果保持原时点。实现变化时修改对应章节，新的评测只添加新报告，不覆盖旧成绩。\u003c/p>\n","text":"验证、性能与开发入口 每种检查只能证明自己覆盖的部分。单元测试、真实数据库故障验收、浏览器操作和云模型评测分别保存结果。 验证地图 检查 入口 能验证什么 后端离线检查 `mvn -DskipITs verify` 单元测试、格式、架构约束与覆盖率 MySQL 集成测试 `mvn verify` Flyway、行锁、重复确认、事务和退款约束 前端 `npm run lint`、`npm test`、`npm run build` 类型、界面状态与产物构建 Python 评测契约 `python -B -m unittest discover -s scripts/evaluation/tests` 标签、分母、追踪解析与报告计算 真实 API / 浏览器 CI 与 运行手册 取消、恢复、退款渠道、工单和退货 云模型评测 RAG 评测 冻结问题与模型配置下的实际行为 可选本地 Grader 验收需要模型服务；跳过不会成为通过证据。CI 使用 Demo 与本地模拟渠道，不调用付费模型。具体开发命令见 CONTRIBUTING。 测试从哪里读 ServiceFlowIntegrationIT：确认与放弃竞争、幂等、退款租约和数据库结果。 OrderConversationTest：查询计划、订单归属、候选选择和取消意图。 RagRewriteDiagnosticsTest：检索模式和原问题约束。 前端 E2E：区分 mock 界面场景与真实后端场景。 refund_delivery.py：独立渠道响应丢失、重复处理、租约和人工接手。 recovery_demo.py：事务已提交、响应缺失、缓存丢失与服务重启。 订单查询性能 原先将完整订单号放进模糊 keyword 条件，会扫描大量属于该客户的订单。增加 `orderNo` 精确参数后使用已有唯一索引；普通商品关键词仍保留模糊匹配语义。网页识别完整编号后选择精确参数，同一查询仍校验客户归属。 通过 EXPLAIN ANALYZE 核对扫描路径，在 **100 万合成订单、单客户 20 万订单** 的本地预热测试中，**8 并发 HTTP P95 从 1.67 s 降到 10.4 ms**。这是特定数据分布和完整订单号查询下的对照，不是所有订单查询或生产吞吐保证。 测量结果 性能场景 历史优化报告 OrderMapper.xml 文档如何维护 本 Wiki 的正文源文件在 `docs/wiki/`。修改 Markdown 后执行： # 缺依赖时先在 apps/serviceflow-web 执行 npm ci node scripts/docs/build-wiki.mjs node scripts/docs/build-wiki.mjs --check 生成的 `docs/architecture-guide.html` 内嵌正文、搜索索引、样式和脚本，可直接离线打开。源码链接和外部报告需要打开仓库；Wiki 正文阅读与搜索不需要联网。不要直接编辑生成文件。 README 只介绍定位与入口；指南保存操作步骤；Wiki 解释当前设计；ADR 保存决策理由；历史报告与实验结果保持原时点。实现变化时修改对应章节，新的评测只添加新报告，不覆盖旧成绩。"},{"id":"glossary","group":"开发与验证","title":"术语与边界","headings":[],"html":"\u003ch1 id=\"术语与边界\">术语与边界\u003c/h1>\n\u003cp>这里列的是 ServiceFlow 实际使用的含义，便于从简历或设计说明回到代码。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>在本项目中指什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>工作流 / Workflow\u003c/td>\n\u003ctd>LangGraph4j 组织的有状态路由与节点执行，不是任意工具自主循环\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询计划\u003c/td>\n\u003ctd>一次模型输出的受约束 JSON，后端校验后执行既有查询工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Checkpoint\u003c/td>\n\u003ctd>Redis 中的图状态快照，不是订单或退款的执行凭证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>同一业务请求重复到达时保持首次结果，不重复创建操作或退款\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>订单版本\u003c/td>\n\u003ctd>确认卡生成时绑定的版本；实际执行时检查订单是否已经变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Outbox\u003c/td>\n\u003ctd>与业务记录同事务写入的待投递记录，用于驱动后续通知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Publisher Confirm\u003c/td>\n\u003ctd>RabbitMQ 对发布的确认，不代表业务任务完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>租约 / leaseToken\u003c/td>\n\u003ctd>限期处理权及其身份标记，阻止过期工作线程覆盖新执行结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询优先\u003c/td>\n\u003ctd>渠道结果不明时先查原退款编号，不能直接重新发起退款\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>活动版本\u003c/td>\n\u003ctd>MySQL 指定的当前可检索文档版本，只有完整 READY 的版本才能激活\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RRF\u003c/td>\n\u003ctd>根据两路排名做倒数排名融合，此处 k=60\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reranker\u003c/td>\n\u003ctd>用问题与候选段落重新计算相关性，选前五\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grader\u003c/td>\n\u003ctd>判断证据是否足以回答原问题，并筛选证据；与离线答案判分不是同一个角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grounded answer\u003c/td>\n\u003ctd>模型选事实编号，后端校验后输出目录事实或完整来源段落\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recall@5 / MRR@5\u003c/td>\n\u003ctd>检索阶段的章节覆盖和首个相关结果排名指标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>规则通过率\u003c/td>\n\u003ctd>是否符合冻结的事实与范围标签，不等于独立人工语义正确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Demo\u003c/td>\n\u003ctd>不调用真实模型的业务演示模式；用于验证流程，不能证明模型质量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>相关设计决策：\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/adr/0001-mvc-virtual-threads.md\" target=\"_blank\" rel=\"noopener noreferrer\">MVC 与虚拟线程\u003c/a>、\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/adr/0002-facts-rag-separation.md\" target=\"_blank\" rel=\"noopener noreferrer\">事实与 RAG 分离\u003c/a>、\u003ca href=\"https://github.com/Titans23/serviceflow/blob/main/docs/adr/0003-outbox-and-idempotency.md\" target=\"_blank\" rel=\"noopener noreferrer\">Outbox 与幂等\u003c/a>。\u003c/p>\n","text":"术语与边界 这里列的是 ServiceFlow 实际使用的含义，便于从简历或设计说明回到代码。 术语 在本项目中指什么 工作流 / Workflow LangGraph4j 组织的有状态路由与节点执行，不是任意工具自主循环 查询计划 一次模型输出的受约束 JSON，后端校验后执行既有查询工具 Checkpoint Redis 中的图状态快照，不是订单或退款的执行凭证 幂等 同一业务请求重复到达时保持首次结果，不重复创建操作或退款 订单版本 确认卡生成时绑定的版本；实际执行时检查订单是否已经变化 Outbox 与业务记录同事务写入的待投递记录，用于驱动后续通知 Publisher Confirm RabbitMQ 对发布的确认，不代表业务任务完成 租约 / leaseToken 限期处理权及其身份标记，阻止过期工作线程覆盖新执行结果 查询优先 渠道结果不明时先查原退款编号，不能直接重新发起退款 活动版本 MySQL 指定的当前可检索文档版本，只有完整 READY 的版本才能激活 RRF 根据两路排名做倒数排名融合，此处 k=60 Reranker 用问题与候选段落重新计算相关性，选前五 Grader 判断证据是否足以回答原问题，并筛选证据；与离线答案判分不是同一个角色 Grounded answer 模型选事实编号，后端校验后输出目录事实或完整来源段落 Recall@5 / MRR@5 检索阶段的章节覆盖和首个相关结果排名指标 规则通过率 是否符合冻结的事实与范围标签，不等于独立人工语义正确率 Demo 不调用真实模型的业务演示模式；用于验证流程，不能证明模型质量 相关设计决策：MVC 与虚拟线程、事实与 RAG 分离、Outbox 与幂等。"}]</script>
    <script>
      const pages = JSON.parse(document.getElementById('wiki-data').textContent)
      const $ = (id) => document.getElementById(id)
      const route = (id, anchor = '') =>
        '#article/' + id + (anchor ? '/' + encodeURIComponent(anchor) : '')
      const link = (title, href) => {
        const a = document.createElement('a')
        a.textContent = title
        a.href = href
        return a
      }
      document.querySelector('.skip').addEventListener('click', (event) => {
        event.preventDefault()
        $('main').focus()
        window.scrollTo(0, 0)
      })
      let group = ''
      for (const page of pages) {
        if (page.group !== group) {
          group = page.group
          const label = document.createElement('div')
          label.className = 'nav-group'
          label.textContent = group
          $('sidebar').append(label)
        }
        $('sidebar').append(link(page.title, route(page.id)))
      }
      const offline = document.createElement('div')
      offline.className = 'offline'
      offline.textContent = pages.length + ' 章 · 当前实现与代码入口。历史结果保留原统计口径。'
      $('sidebar').append(offline)
      function closeMenu() {
        $('sidebar').classList.remove('open')
        $('menu').setAttribute('aria-expanded', 'false')
      }
      function render() {
        const [, id = 'overview', encoded = ''] = location.hash.slice(1).split('/')
        const page = pages.find((p) => p.id === id)
        if (!page) {
          location.replace(route('overview'))
          return
        }
        const index = pages.indexOf(page)
        $('article').innerHTML = page.html
        $('category').textContent = page.group
        $('position').textContent = String(index + 1).padStart(2, '0') + ' / ' + pages.length
        document.title = page.title + ' · ServiceFlow Wiki'
        for (const a of $('sidebar').querySelectorAll('a')) {
          if (a.hash === route(page.id)) a.setAttribute('aria-current', 'page')
          else a.removeAttribute('aria-current')
        }
        $('toc').replaceChildren()
        const label = document.createElement('strong')
        label.textContent = '本页内容'
        $('toc').append(label)
        for (const heading of page.headings) {
          const a = link(heading.title, route(page.id, heading.id))
          if (heading.level === 'h3') a.className = 'sub'
          $('toc').append(a)
        }
        $('pager').replaceChildren()
        for (const [offset, caption] of [
          [-1, '上一章'],
          [1, '下一章'],
        ]) {
          const next = pages[index + offset]
          if (!next) continue
          const a = link(next.title, route(next.id))
          const small = document.createElement('small')
          small.textContent = caption
          a.prepend(small)
          $('pager').append(a)
        }
        $('results').hidden = true
        closeMenu()
        let anchor = ''
        try {
          anchor = decodeURIComponent(encoded)
        } catch {
          /* Invalid deep link: show page top. */
        }
        requestAnimationFrame(() => {
          const target = anchor && document.getElementById(anchor)
          if (target) target.scrollIntoView()
          else window.scrollTo(0, 0)
        })
      }
      $('menu').addEventListener('click', () => {
        const open = $('sidebar').classList.toggle('open')
        $('menu').setAttribute('aria-expanded', String(open))
      })
      document.addEventListener('click', (event) => {
        if (!event.target.closest('#sidebar,#menu')) closeMenu()
        if (!event.target.closest('#results,#search')) $('results').hidden = true
      })
      function search() {
        const query = $('search').value.trim().toLowerCase()
        $('result-list').replaceChildren()
        $('results').hidden = !query
        if (!query) return
        const words = query.split(/\s+/)
        const matches = pages.filter((p) =>
          words.every((word) => p.text.toLowerCase().includes(word)),
        )
        $('result-count').textContent = matches.length
          ? '找到 ' + matches.length + ' 个章节'
          : '没有匹配的章节，试试“退款”“分词”或“Recall”。'
        for (const page of matches) {
          const li = document.createElement('li')
          const a = link(page.title, route(page.id))
          const excerpt = document.createElement('small')
          const start = Math.max(0, page.text.toLowerCase().indexOf(words[0]) - 32)
          excerpt.textContent = (start ? '…' : '') + page.text.slice(start, start + 150) + '…'
          a.append(excerpt)
          li.append(a)
          $('result-list').append(li)
          a.addEventListener('click', () => {
            $('results').hidden = true
            $('search').value = ''
          })
        }
      }
      $('search').addEventListener('input', search)
      $('search').addEventListener('focus', search)
      document.addEventListener('keydown', (event) => {
        if (
          event.key === '/' &&
          !event.ctrlKey &&
          !event.metaKey &&
          !event.target.matches('input,textarea,[contenteditable]')
        ) {
          event.preventDefault()
          $('search').focus()
        }
        if (event.key === 'Escape') {
          $('results').hidden = true
          $('search').value = ''
          $('search').blur()
          closeMenu()
        }
      })
      $('search').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          const first = $('result-list').querySelector('a')
          if (first) first.click()
        }
      })
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme
        $('theme').textContent = theme === 'dark' ? '浅色' : '深色'
      }
      let stored
      try {
        stored = localStorage.getItem('serviceflow-wiki-theme')
      } catch {
        /* File storage can be disabled. */
      }
      setTheme(stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
      $('theme').addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
        setTheme(theme)
        try {
          localStorage.setItem('serviceflow-wiki-theme', theme)
        } catch {}
      })
      window.addEventListener('hashchange', render)
      render()
    </script>
  </body>
</html>
