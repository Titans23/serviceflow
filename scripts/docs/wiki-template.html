<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ServiceFlow 架构 Wiki：业务 Agent、取消确认、异步退款、RAG 与真实评测。可离线阅读。"
    />
    <title>ServiceFlow · 架构 Wiki</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --panel: #f7f8fa;
        --text: #263248;
        --muted: #637086;
        --line: #e2e7ee;
        --brand: #245ad0;
        --soft: #eaf0ff;
        --code: #f3f5f8;
        --shadow: 0 16px 48px #1c2c4520;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #141923;
        --panel: #1a2130;
        --text: #e0e6ef;
        --muted: #a3afc3;
        --line: #303a4c;
        --brand: #8babff;
        --soft: #253754;
        --code: #202a39;
        --shadow: 0 16px 48px #0006;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: 88px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.85 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      a {
        color: var(--brand);
        text-decoration: none;
        text-underline-offset: 3px;
      }
      a:hover {
        text-decoration: underline;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
      }
      button:hover {
        background: var(--soft);
      }
      :focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
      .skip {
        position: fixed;
        left: 12px;
        top: -60px;
        z-index: 20;
        background: var(--bg);
        padding: 8px 15px;
      }
      .skip:focus {
        top: 8px;
      }
      header {
        position: sticky;
        top: 0;
        height: 68px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 28px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        z-index: 10;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-weight: 750;
        white-space: nowrap;
      }
      .mark {
        background: var(--brand);
        color: var(--bg);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        text-align: center;
        line-height: 30px;
      }
      .brand small {
        color: var(--muted);
        font-weight: 400;
        margin-left: 8px;
      }
      .search-wrap {
        margin-left: auto;
        width: min(360px, 35vw);
      }
      #search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 7px 13px;
      }
      .repo {
        font-size: 13px;
      }
      #menu {
        display: none;
      }
      .layout {
        max-width: 1536px;
        margin: auto;
        display: grid;
        grid-template-columns: 254px minmax(0, 1fr) 205px;
        min-height: calc(100vh - 68px);
      }
      #sidebar {
        position: sticky;
        top: 68px;
        height: calc(100vh - 68px);
        overflow: auto;
        padding: 28px 18px 40px;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      .nav-group {
        margin: 24px 12px 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .nav-group:first-child {
        margin-top: 0;
      }
      #sidebar a {
        display: block;
        padding: 6px 12px;
        color: var(--muted);
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.7;
      }
      #sidebar a:hover {
        background: var(--soft);
        text-decoration: none;
        color: var(--brand);
      }
      #sidebar a[aria-current='page'] {
        background: var(--soft);
        color: var(--brand);
        font-weight: 650;
      }
      .offline {
        margin: 32px 12px 0;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      main {
        min-width: 0;
        padding: 38px clamp(24px, 4vw, 64px) 56px;
      }
      .eyebrow {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.4px;
      }
      #article {
        max-width: 880px;
        margin: auto;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: 32px;
        line-height: 1.4;
        letter-spacing: -0.5px;
        margin: 18px 0 20px;
      }
      h2 {
        font-size: 22px;
        line-height: 1.55;
        margin: 42px 0 16px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }
      h3 {
        font-size: 17px;
        margin: 26px 0 10px;
      }
      p {
        margin: 14px 0;
      }
      h1 + p {
        font-size: 17px;
        color: var(--muted);
        line-height: 1.9;
        margin-bottom: 28px;
      }
      ul,
      ol {
        padding-left: 24px;
      }
      li {
        margin: 7px 0;
      }
      strong {
        font-weight: 650;
      }
      code {
        font-family: Consolas, 'SFMono-Regular', monospace;
        font-size: 0.88em;
        background: var(--code);
        padding: 2px 5px;
        border-radius: 4px;
      }
      pre {
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        overflow-x: auto;
        line-height: 1.7;
        font-size: 13px;
      }
      pre code {
        background: none;
        padding: 0;
        white-space: pre;
      }
      table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        font-size: 13px;
        margin: 20px 0;
      }
      td,
      th {
        padding: 10px 13px;
        border: 1px solid var(--line);
        min-width: 100px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--panel);
        font-weight: 650;
      }
      blockquote {
        margin: 20px 0;
        padding: 1px 18px;
        border-left: 3px solid var(--brand);
        background: var(--panel);
        color: var(--muted);
      }
      #toc {
        position: sticky;
        top: 68px;
        height: calc(100vh - 68px);
        overflow: auto;
        padding: 36px 20px 30px 0;
        font-size: 12px;
      }
      #toc strong {
        display: block;
        margin-bottom: 12px;
        color: var(--muted);
      }
      #toc a {
        display: block;
        padding: 5px 0 5px 12px;
        border-left: 1px solid var(--line);
        color: var(--muted);
        line-height: 1.6;
      }
      #toc a.sub {
        padding-left: 24px;
      }
      #toc a:hover {
        color: var(--brand);
      }
      #pager {
        display: flex;
        gap: 16px;
        justify-content: space-between;
        max-width: 880px;
        margin: 44px auto 0;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      #pager a {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 16px;
        width: 50%;
        font-size: 14px;
      }
      #pager small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      #pager a:last-child {
        margin-left: auto;
        text-align: right;
      }
      #results {
        position: fixed;
        top: 76px;
        right: 28px;
        width: min(650px, calc(100vw - 32px));
        max-height: 75vh;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        z-index: 11;
        padding: 16px;
      }
      #results[hidden] {
        display: none;
      }
      #result-count {
        margin: 0 8px 8px;
        color: var(--muted);
        font-size: 12px;
      }
      #result-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #result-list a {
        display: block;
        padding: 12px;
        border-radius: 7px;
      }
      #result-list a:hover {
        background: var(--soft);
        text-decoration: none;
      }
      #result-list small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        margin-top: 4px;
      }
      footer {
        max-width: 880px;
        margin: 28px auto 0;
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 1150px) {
        .layout {
          grid-template-columns: 235px minmax(0, 1fr);
        }
        #toc {
          display: none;
        }
      }
      @media (max-width: 760px) {
        header {
          gap: 10px;
          padding: 0 12px;
          height: 60px;
        }
        .brand small,
        .repo {
          display: none;
        }
        .brand {
          font-size: 14px;
        }
        .mark {
          display: none;
        }
        .search-wrap {
          width: auto;
          min-width: 0;
          flex: 1;
        }
        #search {
          min-width: 0;
          font-size: 13px;
        }
        #theme {
          padding: 5px 8px;
          font-size: 12px;
        }
        #menu {
          display: block;
          font-size: 12px;
          padding: 5px 8px;
        }
        .layout {
          display: block;
        }
        #sidebar {
          display: none;
          position: fixed;
          top: 60px;
          bottom: 0;
          left: 0;
          width: 270px;
          height: calc(100vh - 60px);
          z-index: 9;
          box-shadow: var(--shadow);
        }
        #sidebar.open {
          display: block;
        }
        main {
          padding: 24px 20px 40px;
        }
        h1 {
          font-size: 27px;
        }
        h2 {
          font-size: 20px;
        }
        #results {
          top: 68px;
          right: 16px;
        }
        .eyebrow {
          font-size: 11px;
        }
      }
      @media print {
        header,
        #sidebar,
        #toc,
        #pager,
        .eyebrow {
          display: none;
        }
        .layout {
          display: block;
        }
        main {
          padding: 0;
        }
        body {
          color: #000;
          background: #fff;
          font-size: 11pt;
        }
        pre {
          white-space: pre-wrap;
        }
        a {
          color: inherit;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">跳转到正文</a>
    <header>
      <button id="menu" type="button" aria-controls="sidebar" aria-expanded="false">目录</button>
      <a class="brand" href="#article/overview"
        ><span class="mark">S</span>ServiceFlow <small>架构 Wiki</small></a
      >
      <div class="search-wrap">
        <input
          id="search"
          type="search"
          placeholder="搜索文档  /"
          aria-label="搜索 Wiki 全文"
          aria-controls="results"
          autocomplete="off"
        />
      </div>
      <a
        class="repo"
        href="https://github.com/Titans23/serviceflow"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub ↗</a
      >
      <button id="theme" type="button" aria-label="切换深色或浅色主题">深色</button>
    </header>
    <section id="results" aria-label="搜索结果" hidden>
      <p id="result-count" role="status"></p>
      <ul id="result-list"></ul>
    </section>
    <div class="layout">
      <nav id="sidebar" aria-label="章节目录"></nav>
      <main id="main" tabindex="-1">
        <div class="eyebrow"><span id="category"></span><span id="position"></span></div>
        <article id="article"></article>
        <nav id="pager" aria-label="相邻章节"></nav>
        <footer>正文与搜索可离线使用 · 源码和报告链接打开 GitHub · 由 docs/wiki/ 生成</footer>
        <noscript
          >请启用 JavaScript 阅读本 Wiki，或直接打开 docs/wiki/ 中的 Markdown 文件。</noscript
        >
      </main>
      <aside id="toc" aria-label="本页目录"></aside>
    </div>
    <script id="wiki-data" type="application/json">/* WIKI_DATA */</script>
    <script>
      const pages = JSON.parse(document.getElementById('wiki-data').textContent)
      const $ = (id) => document.getElementById(id)
      const route = (id, anchor = '') =>
        '#article/' + id + (anchor ? '/' + encodeURIComponent(anchor) : '')
      const link = (title, href) => {
        const a = document.createElement('a')
        a.textContent = title
        a.href = href
        return a
      }
      document.querySelector('.skip').addEventListener('click', (event) => {
        event.preventDefault()
        $('main').focus()
        window.scrollTo(0, 0)
      })
      let group = ''
      for (const page of pages) {
        if (page.group !== group) {
          group = page.group
          const label = document.createElement('div')
          label.className = 'nav-group'
          label.textContent = group
          $('sidebar').append(label)
        }
        $('sidebar').append(link(page.title, route(page.id)))
      }
      const offline = document.createElement('div')
      offline.className = 'offline'
      offline.textContent = pages.length + ' 章 · 当前实现与代码入口。历史结果保留原统计口径。'
      $('sidebar').append(offline)
      function closeMenu() {
        $('sidebar').classList.remove('open')
        $('menu').setAttribute('aria-expanded', 'false')
      }
      function render() {
        const [, id = 'overview', encoded = ''] = location.hash.slice(1).split('/')
        const page = pages.find((p) => p.id === id)
        if (!page) {
          location.replace(route('overview'))
          return
        }
        const index = pages.indexOf(page)
        $('article').innerHTML = page.html
        $('category').textContent = page.group
        $('position').textContent = String(index + 1).padStart(2, '0') + ' / ' + pages.length
        document.title = page.title + ' · ServiceFlow Wiki'
        for (const a of $('sidebar').querySelectorAll('a')) {
          if (a.hash === route(page.id)) a.setAttribute('aria-current', 'page')
          else a.removeAttribute('aria-current')
        }
        $('toc').replaceChildren()
        const label = document.createElement('strong')
        label.textContent = '本页内容'
        $('toc').append(label)
        for (const heading of page.headings) {
          const a = link(heading.title, route(page.id, heading.id))
          if (heading.level === 'h3') a.className = 'sub'
          $('toc').append(a)
        }
        $('pager').replaceChildren()
        for (const [offset, caption] of [
          [-1, '上一章'],
          [1, '下一章'],
        ]) {
          const next = pages[index + offset]
          if (!next) continue
          const a = link(next.title, route(next.id))
          const small = document.createElement('small')
          small.textContent = caption
          a.prepend(small)
          $('pager').append(a)
        }
        $('results').hidden = true
        closeMenu()
        let anchor = ''
        try {
          anchor = decodeURIComponent(encoded)
        } catch {
          /* Invalid deep link: show page top. */
        }
        requestAnimationFrame(() => {
          const target = anchor && document.getElementById(anchor)
          if (target) target.scrollIntoView()
          else window.scrollTo(0, 0)
        })
      }
      $('menu').addEventListener('click', () => {
        const open = $('sidebar').classList.toggle('open')
        $('menu').setAttribute('aria-expanded', String(open))
      })
      document.addEventListener('click', (event) => {
        if (!event.target.closest('#sidebar,#menu')) closeMenu()
        if (!event.target.closest('#results,#search')) $('results').hidden = true
      })
      function search() {
        const query = $('search').value.trim().toLowerCase()
        $('result-list').replaceChildren()
        $('results').hidden = !query
        if (!query) return
        const words = query.split(/\s+/)
        const matches = pages.filter((p) =>
          words.every((word) => p.text.toLowerCase().includes(word)),
        )
        $('result-count').textContent = matches.length
          ? '找到 ' + matches.length + ' 个章节'
          : '没有匹配的章节，试试“退款”“分词”或“Recall”。'
        for (const page of matches) {
          const li = document.createElement('li')
          const a = link(page.title, route(page.id))
          const excerpt = document.createElement('small')
          const start = Math.max(0, page.text.toLowerCase().indexOf(words[0]) - 32)
          excerpt.textContent = (start ? '…' : '') + page.text.slice(start, start + 150) + '…'
          a.append(excerpt)
          li.append(a)
          $('result-list').append(li)
          a.addEventListener('click', () => {
            $('results').hidden = true
            $('search').value = ''
          })
        }
      }
      $('search').addEventListener('input', search)
      $('search').addEventListener('focus', search)
      document.addEventListener('keydown', (event) => {
        if (
          event.key === '/' &&
          !event.ctrlKey &&
          !event.metaKey &&
          !event.target.matches('input,textarea,[contenteditable]')
        ) {
          event.preventDefault()
          $('search').focus()
        }
        if (event.key === 'Escape') {
          $('results').hidden = true
          $('search').value = ''
          $('search').blur()
          closeMenu()
        }
      })
      $('search').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          const first = $('result-list').querySelector('a')
          if (first) first.click()
        }
      })
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme
        $('theme').textContent = theme === 'dark' ? '浅色' : '深色'
      }
      let stored
      try {
        stored = localStorage.getItem('serviceflow-wiki-theme')
      } catch {
        /* File storage can be disabled. */
      }
      setTheme(stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
      $('theme').addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
        setTheme(theme)
        try {
          localStorage.setItem('serviceflow-wiki-theme', theme)
        } catch {}
      })
      window.addEventListener('hashchange', render)
      render()
    </script>
  </body>
</html>
